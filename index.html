/* De dónde llega el visitante (Instagram, TikTok...), sin la
   dirección completa para no guardar rastros de navegación. */
/* NAVEGADORES DENTRO DE APPS (Instagram, Facebook, TikTok...)
   Estos navegadores bloquean las ventanas emergentes de forma agresiva:
   window.open devuelve un objeto pero abre una pestaña vacía que nunca
   navega. Por eso salía la página en blanco al entrar desde Instagram.
   Detectándolos, en su lugar se muestra un botón que la persona toca,
   que es lo único fiable ahí. */
function esNavegadorDeApp(){
  const ua = navigator.userAgent || '';
  /* Se listan las firmas REALES de cada app. TikTok, por ejemplo, no
     pone "TikTok" en su navegador: usa musical_ly en iPhone y
     BytedanceWebview en Android, así que buscar la palabra TikTok no
     lo detectaba y esas visitas se perdían. */
  return /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|TikTok|musical_ly|BytedanceWebview|Line\/|Twitter|Snapchat|Pinterest|LinkedInApp|WhatsApp|Telegram|KAKAOTALK|NAVER|Weibo|MicroMessenger/i.test(ua);
}

/* De dónde llega la visita.
   Los navegadores dentro de apps (Instagram, TikTok...) NO envían
   referente, así que todas esas visitas se registraban como "directo"
   y no se sabía de qué red venían. Se detecta primero la app por su
   firma de navegador, y solo si no es ninguna se mira el referente. */
function origenVisita(){
  try{
    const ua = navigator.userAgent || '';
    const apps = [
      [/Instagram/i,            'Instagram'],
      // Messenger va antes que Facebook: su firma incluye FBAN y si no
      // se comprueba primero, todas sus visitas se contarian como Facebook
      [/Messenger/i,            'Messenger'],
      [/FBAN|FBAV|FB_IAB/i,     'Facebook'],
      [/TikTok|BytedanceWebview|musical_ly/i, 'TikTok'],
      [/WhatsApp/i,             'WhatsApp'],
      [/Twitter/i,              'Twitter'],
      [/Snapchat/i,             'Snapchat'],
      [/Pinterest/i,            'Pinterest'],
      [/LinkedInApp/i,          'LinkedIn'],
      [/Line\//i,               'Line'],
      [/Telegram/i,             'Telegram'],
      [/YouTube/i,              'YouTube'],
    ];
    for(let i = 0; i < apps.length; i++){
      if(apps[i][0].test(ua)) return apps[i][1];
    }
    // Navegador normal: se mira de qué web viene
    const r = document.referrer || '';
    if(!r) return 'directo';
    const host = new URL(r).hostname.replace('www.', '');
    const limpio = host.split('.')[0];
    const conocidos = {
      instagram:'Instagram', facebook:'Facebook', tiktok:'TikTok',
      twitter:'Twitter', x:'Twitter', youtube:'YouTube', google:'Google',
      linkedin:'LinkedIn', pinterest:'Pinterest', reddit:'Reddit',
      t:'Twitter', l:'Facebook', lm:'Facebook',
    };
    return conocidos[limpio] || limpio;
  }catch(e){ return 'directo'; }
}

/* Referencias vivas a los píxeles en vuelo, para que el navegador
   no los descarte antes de iniciar la petición. */
const PIXELES_PENDIENTES = [];

/* Cada evento recibe un ID único. El mismo ID se usa en todos los
   transportes de respaldo; el servidor lo usa para ignorar duplicados. */
function crearEventoId(){
  try{
    if(window.crypto && typeof window.crypto.randomUUID === 'function'){
      return window.crypto.randomUUID();
    }
  }catch(e){}
  return (SESION_ID || 'anon') + '_' + Date.now().toString(36) + '_' +
         Math.random().toString(36).slice(2, 10);
}

function paramsAnalitica(cuerpo, transporte){
  const p = ['guardar=1', 'transporte=' + encodeURIComponent(transporte || 'get')];
  Object.keys(cuerpo).forEach(function(k){
    const v = cuerpo[k];
    if(v !== '' && v != null){
      /* Los campos de analítica son cortos. Se limita cada valor para evitar
         URLs gigantes dentro de navegadores integrados. */
      p.push(encodeURIComponent(k) + '=' + encodeURIComponent(String(v).slice(0, 160)));
    }
  });
  p.push('_=' + Date.now() + Math.random().toString(36).slice(2,6));
  return p.join('&');
}

function enviarPixel(cuerpo, transporte){
  try{
    const img = new Image();
    PIXELES_PENDIENTES.push(img);
    const quitar = function(){
      const i = PIXELES_PENDIENTES.indexOf(img);
      if(i !== -1) PIXELES_PENDIENTES.splice(i, 1);
    };
    img.onload = quitar;
    img.onerror = quitar; // Apps Script responde texto; el GET ya se realizó.
    img.src = ANALYTICS_URL + '?' + paramsAnalitica(cuerpo, transporte || 'pixel');
    /* Evita mantener referencias para siempre si el navegador no dispara
       load/error al suspender la página. */
    setTimeout(quitar, 15000);
  }catch(e){}
}

function enviarGetRespaldo(cuerpo, transporte){
  try{
    fetch(ANALYTICS_URL + '?' + paramsAnalitica(cuerpo, transporte || 'fetch_get'), {
      method: 'GET', mode: 'no-cors', redirect: 'follow', keepalive: true,
      cache: 'no-store', credentials: 'omit'
    }).catch(function(){});
  }catch(e){}
}

function enviarEvento(evento, extra){
  if(!ANALYTICS_URL) return;
  try{
    const cuerpo = Object.assign({
      evento: evento,
      eventId: crearEventoId(),
      influencer: (typeof ACTIVE_INFLUENCER !== 'undefined' && ACTIVE_INFLUENCER)
                    ? ACTIVE_INFLUENCER.influencerId : 'directo',
      sesion: SESION_ID,
      idioma: CURRENT_LANG,
      visitaNum: VISITA_NUM,
      segundos: Math.round((Date.now() - INICIO_APP) / 1000),
    }, extra || {});

    const texto = JSON.stringify(cuerpo);
    const dentroApp = esNavegadorDeApp();

    /* Estrategia resistente a navegadores integrados:
       - Instagram/Facebook/TikTok/etc.: GET por imagen + GET no-cors.
       - Safari/Chrome/etc.: sendBeacon y, además, un píxel de respaldo.
       Los dos intentos llevan el MISMO eventId; Code.gs deduplica bajo lock,
       así que ganar fiabilidad no duplica las métricas. */
    if(dentroApp){
      enviarPixel(cuerpo, 'pixel_app');
      enviarGetRespaldo(cuerpo, 'fetch_get_app');
      return;
    }

    let beaconAceptado = false;
    try{
      if(navigator.sendBeacon){
        const blob = new Blob([texto], {type: 'text/plain;charset=UTF-8'});
        beaconAceptado = navigator.sendBeacon(ANALYTICS_URL, blob);
      }
    }catch(e){}

    /* El píxel se envía incluso si sendBeacon dice "true": true solo significa
       que el navegador aceptó encolar el envío, no que Apps Script lo guardó.
       La deduplicación del servidor evita contar dos veces si llegan ambos. */
    enviarPixel(cuerpo, beaconAceptado ? 'pixel_backup_beacon' : 'pixel_backup');

    if(!beaconAceptado){
      try{
        fetch(ANALYTICS_URL, {
          method: 'POST', mode: 'no-cors', redirect: 'follow', keepalive: true,
          headers: {'Content-Type':'text/plain;charset=utf-8'}, body: texto,
          credentials: 'omit'
        }).catch(function(){});
      }catch(e){}
    }
  }catch(e){}
}

/* Convierte el costo mensual a dólares aproximados para poder comparar
   entre países. Se usa el precio del arroz como referencia porque es el
   alimento más estable y presente en los 71 países. No es un tipo de
   cambio oficial: sirve para comparar entre sí, no para contabilidad. */
function costoEnDolares(costoLocal, codigoPais){
  try{
    const local = PRICES[codigoPais] && PRICES[codigoPais].arroz;
    const usa   = PRICES.US && PRICES.US.arroz;
    if(!local || !usa) return 0;
    const factor = local / usa;
    return factor > 0 ? Math.round(costoLocal / factor) : 0;
  }catch(e){ return 0; }
}

/* Lista de compra de un rango de días específico (para las semanas 1-4).
   IMPORTANTE — cómo se calcula el costo semanal:
   El costo se reparte PROPORCIONALMENTE a partir del costo mensual real,
   NO redondeando unidades semana por semana. Si se redondeara hacia arriba
   en cada semana (Math.ceil x4), la suma de las 4 semanas superaría el
   total del mes — que era el error detectado: 4 semanas sumaban RD$19,065
   frente a un total mensual de RD$11,315. Ahora la suma de las semanas
   siempre cuadra con el total mensual. */
function buildPurchaseForDays(R, days){
  const consumption = {};
  days.forEach(d=>{
    allDayItems(d.tmpl).forEach(it=>{ consumption[it.id] = (consumption[it.id]||0) + it.g; });
  });
  // Consumo mensual real por alimento (para repartir el costo en proporción)
  const monthly = {};
  R.days.forEach(d=>{
    allDayItems(d.tmpl).forEach(it=>{ monthly[it.id] = (monthly[it.id]||0) + it.g; });
  });
  return Object.keys(consumption).map(id=>{
    const f = FOODS[id];
    const gramsNeeded = consumption[id];
    // Subtotal del mes para este alimento (con su redondeo comercial correcto,
    // hecho UNA sola vez sobre el mes completo)
    const monthlyGrams = monthly[id] || gramsNeeded;
    const monthlyUnits = Math.ceil(monthlyGrams / f.gPerUnit);
    const price = R.priceSet[id] || 0;
    const monthlySubtotal = monthlyUnits * price;
    // Parte proporcional que le toca a este rango de días
    const share = monthlyGrams > 0 ? (gramsNeeded / monthlyGrams) : 0;
    const subtotal = monthlySubtotal * share;
    const unitsNeeded = monthlyUnits * share; // sin redondear hacia arriba aquí
    return { id, name:foodName(id), gramsNeeded, unitsNeeded, unit:f.unit, price, subtotal,
             group: shopGroup(id) };
  }).sort((a,b)=> (SHOP_GROUP_META[a.group].order - SHOP_GROUP_META[b.group].order) || (b.subtotal - a.subtotal));
}
const WEEK_RANGES = [[0,7],[7,14],[14,21],[21,30]]; // días 1-7, 8-14, 15-21, 22-30

/* ============================================================
   MODAL DE SUPLEMENTOS + DESCARGA + PANTALLA DEL INFLUENCER
   Compartido por Modelo 0 y Modelo 1 (mismo flujo que pediste):
   Descargar -> modal de suplementos (afiliados Amazon) ->
   descargar de verdad -> pantalla del influencer con WhatsApp.
   ============================================================ */
/* ============================================================
   FLUJO DE DESCARGA (nuevo)
   Un solo boton hace tres cosas en orden:
     1. Descarga la imagen del presupuesto
     2. Abre Instacart con la lista completa (si esta configurado)
     3. Lleva a la pantalla del influencer, con los suplementos
        recomendados y el precio total debajo
   Ya no hay ventana flotante: ese contenido vive ahora al final.
   ============================================================ */
let VENTANA_TIENDA = null;
let DESTINO_TIENDA = '';

async function descargarYComprar(R, target, btn){
  target = target || {type:'plan'};
  trackEvent('download_clicked', {type: target.type});

  /* La tienda se abre AQUÍ, en el primer instante tras el toque.
     Los navegadores solo permiten abrir una ventana por interacción del
     usuario, y ese permiso se pierde en cuanto pasa algo asíncrono como
     generar la imagen. Abriéndola primero, la pestaña sale con la página
     cargada en vez de quedarse en blanco; la descarga se hace después
     sin necesitar ventana propia. */
  VENTANA_TIENDA = null;
  if(showCartButton(R.country)){
    const sp = supermercadoDe(R.country);
    let destino = '';
    if(sp){
      destino = sp.url;
      if(destino.indexOf('{q}') !== -1){
        const pr = R.purchase[0];
        destino = destino.replace('{q}', encodeURIComponent(pr ? (CART_SEARCH[pr.id] || pr.name) : ''));
      }
    } else if(CART_MODO_PRUEBA && !CART_API_ENDPOINT){
      destino = CART_URL_PRUEBA;
    }
    /* Ya NO se abre ninguna ventana desde aquí. El propio botón es un
       enlace <a href> a la tienda, así que el navegador lo trata como
       una navegación normal del usuario: funciona incluso dentro de
       Instagram, y nunca aparece una pestaña en blanco. */
    DESTINO_TIENDA = destino;
    VENTANA_TIENDA = true;   // la navegación la hace el propio enlace
  }

  // --- 1. Descarga ---
  const safeName = R.nombre.replace(/\s+/g,'_');
  if(target.type === 'dia' && target.value){
    const d = R.days[parseInt(target.value,10)-1];
    downloadCanvasAsPNG(drawWeekDayImage(R, d, themeColors()), 'COMEPRO_dia' + d.idx + '_' + safeName + '.png');
  } else if(target.type === 'semana' && target.value !== undefined){
    const wi = parseInt(target.value,10);
    const rango = WEEK_RANGES[wi];
    const weekPurchase = buildPurchaseForDays(R, R.days.slice(rango[0], rango[1]));
    downloadCanvasAsPNG(drawWeekPurchaseImage(R, wi+1, rango[0]+1, rango[1], weekPurchase), 'COMEPRO_semana' + (wi+1) + '_' + safeName + '.png');
  } else if(target.type === 'semanalPromedio'){
    downloadCanvasAsPNG(drawWeeklyAverageImage(R), 'COMEPRO_semanal_' + safeName + '.png');
  } else {
    downloadCanvasAsPNG(drawPurchaseImage(R), 'COMEPRO_plan_' + safeName + '.png');
  }
  trackEvent('budget_downloaded', {type: target.type});
  enviarEvento('descarga', Object.assign(datosPerfil(R), {detalle: target.type}));

  // --- 2. Instacart con la lista completa ---
  if(showCartButton(R.country)){
    // Si el país tiene su propio supermercado configurado, va primero
    const superPais = supermercadoDe(R.country);
    if(superPais){
      enviarEvento('supermercado', Object.assign(datosPerfil(R), {detalle: superPais.nombre}));
      mostrarPantallaFinal(R);
      return;
    }
    if(CART_MODO_PRUEBA && !CART_API_ENDPOINT){
      trackEvent('cart_link_opened', {modo:'prueba', items: R.purchase.length});
      enviarEvento('instacart', datosPerfil(R));
      /* La tienda se abrió al principio de la función, aprovechando el
         toque del usuario: los navegadores solo conceden una ventana por
         interacción, y si se pide después de la descarga la bloquean o
         sale en blanco. Aquí solo se deja el enlace por si acaso. */
      mostrarPantallaFinal(R);
      return;
    }
    if(btn){ btn.disabled = true; btn.textContent = t('r_generandoLista'); }
    try{
      const items = R.purchase.map(function(p){
        return {
          name: CART_SEARCH[p.id] || p.name,
          quantity: p.unitsNeeded,
          unit: p.unit === 'lb' ? 'lb' : (p.unit === 'unidad' || p.unit === 'unidad_grande' ? 'each' : 'package')
        };
      });
      const res = await fetch(CART_API_ENDPOINT, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ title:'COME PRO - ' + R.nombre, items: items })
      });
      if(res.ok){
        const data = await res.json();
        if(data && data.url){
          trackEvent('cart_link_opened', {items: items.length});
          const win = window.open(data.url, '_blank', 'noopener');
          // Si el navegador bloquea la ventana, dejamos un enlace visible
          if(!win) mostrarEnlaceRespaldo(data.url);
        }
      }
    }catch(e){
      if(typeof DEBUG_MODE !== 'undefined' && DEBUG_MODE) console.warn('COME PRO: lista Instacart no disponible', e);
    }
    if(btn){ btn.disabled = false; btn.textContent = t('r_descargarYComprar'); }
  }

  // --- 3. Pantalla final: influencer + suplementos + total ---
  mostrarPantallaFinal(R);
}

/* ============================================================
   6) DESCARGAS — "fotos" de la página (PNG), no texto plano.
   Cada imagen se dibuja con el mismo estilo de tarjetas de la página
   (colores, modo claro/oscuro activo, nombre del usuario), usando
   directamente los datos ya calculados y auditados arriba.
   ============================================================ */
function themeColors(){
  const dark = document.body.dataset.theme !== 'light';
  return dark
    ? { bg:"#0b0f0c", card:"#151b13", card2:"#1a2117", line:"#26301f", text:"#f4f6f2", muted:"#8fa088",
        accent:"#7ed957", pink:"#ec6fa3", purple:"#8b7ce8", orange:"#f0a94e", amber:"#e8b84e" }
    : { bg:"#f5f7f3", card:"#ffffff", card2:"#f0f3ee", line:"#e3e8de", text:"#1c231a", muted:"#6b7566",
        accent:"#4caf3e", pink:"#e0568e", purple:"#7a63d6", orange:"#e08e2e", amber:"#d4a02e" };
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
/* Se precarga al abrir la pagina para que ya este disponible
   cuando el usuario pulse descargar. */
function logoActual(){
  // Siempre la versión de letras blancas: se dibuja sobre placa oscura.
  return LOGO_OSCURO;
}

const LOGO_IMG = new Image();
LOGO_IMG.src = logoActual();

function drawBrandHeader(ctx, C, nombre, subtitle){
  const W = ctx.canvas.width;
  // Franja blanca de cabecera
  ctx.fillStyle = C.card; ctx.fillRect(0, 0, W, 150);

  /* Logo sobre placa oscura: en la imagen descargada la cabecera es
     clara, así que el logo de letras blancas se perdía. La placa lo
     hace resaltar igual que en la app. */
  if(LOGO_IMG && LOGO_IMG.complete && LOGO_IMG.naturalWidth){
    const lh = 84, lw = LOGO_IMG.naturalWidth / LOGO_IMG.naturalHeight * lh;
    ctx.fillStyle = "#141a11";
    roundRectPath(ctx, 44, 26, lw + 28, lh + 20, 14);
    ctx.fill();
    ctx.drawImage(LOGO_IMG, 58, 36, lw, lh);
  } else {

    ctx.fillText("COME", 68, 70);
    ctx.fillStyle = "#8ce35f"; ctx.fillText("PRO", 178, 70);
  }

  // Nombre de la persona, destacado arriba
  /* En 820 px no cabe el nombre al lado del logo sin quedar apretado:
     va a la derecha con menos margen y algo mas pequeño. */
  ctx.fillStyle = C.text; ctx.font = "700 27px Fraunces, Georgia, serif";
  ctx.fillText(t('r_planDe') + " " + nombre, 264, 66);
  ctx.fillStyle = C.muted; ctx.font = "500 15px Inter, sans-serif";

  // Subtítulo de la sección, a la derecha

  ctx.textAlign = "right";

  ctx.strokeStyle = C.line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(46,150); ctx.lineTo(W-46,150); ctx.stroke();
}
/* ============================================================
   DESCARGA / GUARDADO DE LA IMAGEN — universal
   Cada plataforma tiene su vía preferida y ninguna funciona en todas:
     · Android e iOS moderno  -> menú nativo de compartir (Web Share)
       permite guardar en la galería, mandar por WhatsApp, etc.
     · Escritorio             -> descarga directa del archivo
     · iOS antiguo / bloqueos -> se abre la imagen en pestaña nueva
       para guardarla con un toque largo
   Se intentan en orden y siempre queda un camino disponible, así que
   nunca ocurre que el usuario pulse y no pase nada.
   ============================================================ */
function downloadCanvasAsPNG(canvas, filename){

  // Último recurso: mostrar la imagen para guardarla manualmente
  /* Muestra la imagen para guardarla a mano.
     Antes se abría una ventana vacía y luego se escribía HTML dentro;
     en iPhone eso dejaba la página en "about:blank" muy a menudo.
     Ahora se abre directamente la URL de la imagen, que el navegador
     ya sabe mostrar, y se puede guardar con un toque largo. */
  function mostrarParaGuardar(url){
    /* No se abre ventana: el permiso del navegador ya se usó para la
       tienda. Se deja un enlace visible en la propia página, que además
       evita que se abra nada en blanco. */
    const w = null;
    if(w) return true;
    // Si el navegador bloqueó la ventana, se deja un enlace visible
    let aviso = document.getElementById('avisoDescarga');
    if(aviso) aviso.remove();
    aviso = document.createElement('div');
    aviso.id = 'avisoDescarga';
    aviso.className = 'warn-box';
    aviso.style.cssText = 'position:fixed;left:12px;right:12px;bottom:80px;z-index:9999;text-align:center;';
    aviso.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener" download="' + filename +
                      '" style="color:var(--accent);font-weight:700;">' + t('r_verImagen') + '</a>';
    document.body.appendChild(aviso);
    setTimeout(function(){ if(aviso) aviso.remove(); }, 20000);
    return false;
  }

  // Descarga clásica: la vía normal en ordenadores y Android
  function descargaDirecta(blob, url){
    const link = document.createElement('a');
    const soportaDownload = 'download' in link;
    if(!soportaDownload) return false;
    link.download = filename;
    link.href = url;
    link.rel = 'noopener';
    link.style.display = 'none';
    document.body.appendChild(link);      // iOS exige que esté en el documento
    link.click();
    setTimeout(function(){
      if(link.parentNode) document.body.removeChild(link);
    }, 100);
    return true;
  }

  function conBlob(blob){
    if(!blob){ mostrarParaGuardar(canvas.toDataURL('image/png')); return; }
    const url = URL.createObjectURL(blob);
    const limpiar = function(){ setTimeout(function(){ URL.revokeObjectURL(url); }, 30000); };

    // 1) Menú nativo de compartir: es lo que permite "Guardar en Fotos"
    //    en iPhone y guardar en la galería en Android.
    try{
      const file = new File([blob], filename, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
        /* Solo se pasa el archivo, sin texto ni titulo: si se incluye
           texto, iOS interpreta el contenido como "enlace o nota" y
           esconde la opcion "Guardar en Fotos" detras del menu. Con
           solo la imagen, Fotos aparece entre las primeras opciones. */
        navigator.share({ files:[file] })
          .then(limpiar)
          .catch(function(err){
            // Si el usuario cancela, no se hace nada más (no es un error)
            if(err && err.name === 'AbortError'){ limpiar(); return; }
            if(!descargaDirecta(blob, url)) mostrarParaGuardar(url);
            limpiar();
          });
        return;
      }
    }catch(e){ /* sin soporte: se sigue con la descarga normal */ }

    // 2) Descarga directa
    if(descargaDirecta(blob, url)){ limpiar(); return; }

    // 3) Mostrar la imagen para guardarla a mano
    mostrarParaGuardar(url);
    limpiar();
  }

  try{
    if(canvas.toBlob){
      canvas.toBlob(conBlob, 'image/png');
    } else {
      mostrarParaGuardar(canvas.toDataURL('image/png'));
    }
  }catch(e){
    if(typeof DEBUG_MODE !== 'undefined' && DEBUG_MODE) console.warn('COME PRO: fallo al guardar la imagen', e);
    try{ mostrarParaGuardar(canvas.toDataURL('image/png')); }catch(e2){}
  }
}

/* Dibuja un anillo de proporciones (dona) igual al de la pantalla */
function drawDonut(ctx, cx, cy, radio, grosor, partes){
  let ang = -Math.PI/2;
  const total = partes.reduce((s,p)=> s+p.valor, 0) || 1;
  partes.forEach(function(p){
    const barrido = (p.valor/total) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, radio, ang, ang+barrido);
    ctx.arc(cx, cy, radio-grosor, ang+barrido, ang, true);
    ctx.closePath();
    ctx.fillStyle = p.color;
    ctx.fill();
    ang += barrido;
  });
}

/* ============================================================
   DOS IMÁGENES EN VEZ DE UNA
   Con los 34 alimentos en la misma imagen, el resultado era una tira
   de casi 2400 px: ilegible en el teléfono e imposible de compartir.
   Ahora se generan dos:
     1. RESUMEN  — casi cuadrado: macros, distribución y costos.
        Es el que la gente comparte.
     2. LISTA    — la compra completa, con columnas claras de SEMANA
        y MES tanto en cantidad como en precio.
   ============================================================ */

/* ============================================================
   IMAGEN ÚNICA
   El resumen ocupa todo el ancho arriba (macros y costo grandes, que
   es lo primero que se mira) y debajo va la lista en dos columnas.
   Con la lista en una sola columna la imagen salía como una tira de
   2400 px, ilegible en el teléfono; en dos columnas se lee de un
   vistazo sin girar el móvil, que es como se usa en el supermercado.
   ============================================================ */
function drawPurchaseImage(R){
  const C = themeColors();
  const W = 1120;
  const rowH = 46;
  const nGrupos = new Set(R.purchase.map(p=>p.group)).size;
  const filasPorCol = Math.ceil((R.purchase.length + nGrupos) / 2);
  const H = 1000 + filasPorCol*rowH + 300;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);
  drawBrandHeader(ctx, C, R.nombre, t('r_tuObjetivoDiario'));
  const SERIF = "Fraunces, Georgia, serif";
  const M = 46;                       // margen lateral
  const ANCHO = W - M*2;

  // ---------- MACROS: 4 en línea, ahora sí caben ----------
  const macros = [
    [fmt(R.calorieTarget), t('r_objkcal'), C.orange],
    [fmt(R.proteinTarget)+"g", t('r_objp'), C.pink],
    [fmt(R.carbTarget)+"g", t('r_objc'), C.purple],
    [fmt(R.fatTarget)+"g", t('r_objf'), C.amber],
  ];
  const cW = (ANCHO - 3*14) / 4;
  macros.forEach(function(m, i){
    const cx = M + i*(cW + 14);
    ctx.fillStyle = C.card2; roundRectPath(ctx, cx, 175, cW, 116, 16); ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth = 1; roundRectPath(ctx, cx, 175, cW, 116, 16); ctx.stroke();
    ctx.fillStyle = m[2]; ctx.font = "800 40px " + SERIF; ctx.textAlign = "center";
    ctx.fillText(m[0], cx + cW/2, 234);
    ctx.fillStyle = C.muted; ctx.font = "500 15px Inter, sans-serif";
    ctx.fillText(m[1], cx + cW/2, 268);
    ctx.textAlign = "left";
  });

  // ---------- DONA + PROMEDIO, uno al lado del otro ----------
  let y = 315;
  const mitad = (ANCHO - 16) / 2;
  ctx.fillStyle = C.text; ctx.font = "700 21px " + SERIF;
  ctx.fillText(t('r_distribucion'), M, y);
  ctx.fillText(t('r_promedio'), M + mitad + 16, y);
  y += 26;

  // Dona (izquierda)
  ctx.fillStyle = C.card2; roundRectPath(ctx, M, y, mitad, 178, 16); ctx.fill();
  const kP = R.proteinTarget*4, kC2 = R.carbTarget*4, kF = R.fatTarget*9;
  const tot = kP + kC2 + kF || 1;
  drawDonut(ctx, M + 100, y + 89, 64, 24, [
    {valor:kP, color:C.pink}, {valor:kC2, color:C.purple}, {valor:kF, color:C.orange},
  ]);
  ctx.textAlign = "center";
  ctx.fillStyle = C.muted; ctx.font = "500 12px Inter, sans-serif";
  ctx.fillText("kcal", M + 100, y + 84);
  ctx.fillStyle = C.text; ctx.font = "800 26px " + SERIF;
  ctx.fillText(fmt(R.calorieTarget), M + 100, y + 112);
  ctx.textAlign = "left";
  let ly = y + 48;
  [[t('r_proteinas'), fmt(R.proteinTarget)+"g", Math.round(kP/tot*100), C.pink],
   [t('r_carbohidratos'), fmt(R.carbTarget)+"g", Math.round(kC2/tot*100), C.purple],
   [t('r_grasas'), fmt(R.fatTarget)+"g", Math.round(kF/tot*100), C.orange]].forEach(function(l){
    ctx.fillStyle = l[3]; roundRectPath(ctx, M + 186, ly-12, 14, 14, 4); ctx.fill();
    ctx.fillStyle = C.text; ctx.font = "500 16px Inter, sans-serif";
    ctx.fillText(l[0], M + 208, ly);
    ctx.font = "700 16px " + SERIF; ctx.textAlign = "right";
    ctx.fillText(l[1], M + mitad - 74, ly);
    ctx.fillStyle = C.muted; ctx.font = "500 14px Inter, sans-serif";
    ctx.fillText("(" + l[2] + "%)", M + mitad - 16, ly);
    ctx.textAlign = "left";
    ly += 42;
  });

  // Promedio real (derecha)
  const xD = M + mitad + 16;
  ctx.fillStyle = C.card2; roundRectPath(ctx, xD, y, mitad, 178, 16); ctx.fill();
  const reales = [
    [fmt(R.avg.kcal), t('r_kcaldia'), C.accent],
    [fmt(R.avg.p)+"g", t('r_proteina'), C.pink],
    [fmt(R.avg.c)+"g", t('r_carbohidratos'), C.purple],
    [fmt(R.avg.f)+"g", t('r_grasasLbl'), C.orange],
  ];
  reales.forEach(function(v, i){
    const px = xD + (i % 2) * (mitad/2) + mitad/4;
    const py = y + 46 + Math.floor(i/2) * 84;
    ctx.fillStyle = v[2]; ctx.font = "800 30px " + SERIF; ctx.textAlign = "center";
    ctx.fillText(v[0], px, py);
    ctx.fillStyle = C.muted; ctx.font = "400 13px Inter, sans-serif";
    ctx.fillText(v[1], px, py + 24);
    ctx.textAlign = "left";
  });

  // ---------- SECUNDARIOS Y COSTOS ----------
  y += 202;
  ctx.fillStyle = C.muted; ctx.font = "400 15px Inter, sans-serif";
  ctx.fillText(t('r_bmr') + ": " + fmt(R.bmr) + "   ·   " + t('r_tdee') + ": " + fmt(R.tdee) +
               "   ·   " + t('r_bmi') + ": " + fmt(R.bmi,1), M, y);
  y += 22;
  ctx.fillStyle = C.card2; roundRectPath(ctx, M, y, mitad, 116, 16); ctx.fill();
  ctx.strokeStyle = C.accent; ctx.lineWidth = 2; roundRectPath(ctx, M, y, mitad, 116, 16); ctx.stroke();
  ctx.fillStyle = C.muted; ctx.font = "600 13px Inter, sans-serif";
  ctx.fillText(t('r_costotitle').toUpperCase(), M + 24, y + 30);
  ctx.fillStyle = C.accent; ctx.font = "800 40px " + SERIF;
  ctx.fillText(R.priceSet.symbol + " " + fmtMoney(R.totalCost), M + 24, y + 80);
  ctx.fillStyle = C.muted; ctx.font = "400 13px Inter, sans-serif";
  ctx.fillText(t('r_promediodiario') + ": " + R.priceSet.symbol + " " + fmtMoney(R.totalCost/30), M + 24, y + 104);

  ctx.fillStyle = C.card2; roundRectPath(ctx, xD, y, mitad, 116, 16); ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; roundRectPath(ctx, xD, y, mitad, 116, 16); ctx.stroke();
  ctx.fillStyle = C.muted; ctx.font = "600 13px Inter, sans-serif";
  ctx.fillText(t('r_presupuestoSemanal').toUpperCase(), xD + 24, y + 30);
  ctx.fillStyle = C.amber; ctx.font = "800 40px " + SERIF;
  // Mismo criterio que la lista: el mes dividido entre 4 semanas
  ctx.fillText(R.priceSet.symbol + " " + fmtMoney(R.totalCost/4), xD + 24, y + 80);
  ctx.fillStyle = C.muted; ctx.font = "400 13px Inter, sans-serif";
  ctx.fillText(R.purchase.length + " " + t('r_alimentosLista'), xD + 24, y + 104);

  // ---------- LISTA EN DOS COLUMNAS ----------
  y += 148;
  ctx.fillStyle = C.text; ctx.font = "700 21px " + SERIF;
  ctx.fillText(t('r_listaCompra'), M, y);
  y += 22;

  const colW = (ANCHO - 24) / 2;
  const COL_X = [M, M + colW + 24];
  // Cabecera de cada columna
  COL_X.forEach(function(cx){
    ctx.fillStyle = C.card2; roundRectPath(ctx, cx, y, colW, 44, 10); ctx.fill();
    ctx.fillStyle = C.text; ctx.font = "700 13px Inter, sans-serif";
    ctx.fillText(t('r_alimento').toUpperCase(), cx + 14, y + 27);
    ctx.textAlign = "center";
    ctx.fillStyle = C.muted; ctx.font = "700 11px Inter, sans-serif";
    ctx.fillText(t('r_semanaN').toUpperCase(), cx + colW - 190, y + 19);
    ctx.fillText(t('r_dlPlan').toUpperCase(), cx + colW - 66, y + 19);
    ctx.font = "500 10px Inter, sans-serif";
    ctx.fillText(t('r_comprar').toLowerCase() + " / " + t('r_subtotal').toLowerCase(), cx + colW - 190, y + 34);
    ctx.fillText(t('r_comprar').toLowerCase() + " / " + t('r_subtotal').toLowerCase(), cx + colW - 66, y + 34);
    ctx.textAlign = "left";
  });
  y += 52;

  // Repartir alimentos y cabeceras de grupo en dos columnas
  const filas = [];
  let gAct = null;
  R.purchase.forEach(function(p){
    if(p.group !== gAct){ gAct = p.group; filas.push({tipo:'grupo', group:p.group}); }
    filas.push({tipo:'item', p:p});
  });
  let corte = Math.ceil(filas.length / 2);
  while(corte > 0 && corte < filas.length && filas[corte-1].tipo === 'grupo') corte--;
  const columnas = [filas.slice(0, corte), filas.slice(corte)];

  let altoMax = y;
  columnas.forEach(function(col, ci){
    const cx = COL_X[ci];
    let yy = y;
    let n = 0;
    col.forEach(function(f){
      if(f.tipo === 'grupo'){
        ctx.fillStyle = C.muted; ctx.font = "700 11px Inter, sans-serif";
        ctx.fillText(shopGroupLabel(f.group).toUpperCase(), cx, yy + 22);
        yy += 30;
        return;
      }
      const p = f.p;
      if(n % 2 === 0){ ctx.fillStyle = C.card; ctx.fillRect(cx, yy, colW, rowH); }
      n++;
      ctx.fillStyle = C.text; ctx.font = "500 15px Inter, sans-serif";
      ctx.fillText(foodEmoji(p.id) + "  " + p.name, cx + 12, yy + 28);

      /* La columna SEMANA se deriva de la MENSUAL dividiendo entre 4,
         no se calcula por separado. Antes cada una redondeaba hacia
         arriba por su cuenta: 2,0 lb pasaba a 3 y 8,6 a 9, así que la
         semana x4 daba 12 y no cuadraba con las 9 del mes.
         Ahora el mes SIEMPRE es la semana x4, y el precio va en la
         misma proporción, de modo que las dos cifras concuerdan. */
      const semC = p.unitsNeeded / 4;
      const semP = p.subtotal / 4;
      ctx.textAlign = "center";
      // SEMANA
      ctx.fillStyle = C.text; ctx.font = "600 13px Inter, sans-serif";
      ctx.fillText(fmt(semC, semC < 10 ? 1 : 0) + " " + unitLabel(p.unit, semC, CURRENT_LANG), cx + colW - 190, yy + 21);
      ctx.fillStyle = C.muted; ctx.font = "500 12px 'IBM Plex Mono', monospace";
      ctx.fillText(R.priceSet.symbol + fmtMoney(semP), cx + colW - 190, yy + 38);
      // MES
      ctx.fillStyle = C.text; ctx.font = "700 13px Inter, sans-serif";
      ctx.fillText(p.unitsNeeded + " " + unitLabel(p.unit, p.unitsNeeded, CURRENT_LANG), cx + colW - 66, yy + 21);
      ctx.fillStyle = C.amber; ctx.font = "700 13px 'IBM Plex Mono', monospace";
      ctx.fillText(R.priceSet.symbol + fmtMoney(p.subtotal), cx + colW - 66, yy + 38);
      ctx.textAlign = "left";
      yy += rowH;
    });
    if(yy > altoMax) altoMax = yy;
  });
  y = altoMax;

  // ---------- PIE ----------
  y += 24;
  ctx.fillStyle = C.muted; ctx.font = "italic 13px Inter, sans-serif";
  const pais = (COUNTRIES.find(function(c){ return c.code === R.country; }) || {})[CURRENT_LANG==='en'?'en':'es'] || R.country;
  ctx.fillText(pais + " · " + R.priceSet.symbol + " · " + (R.priceSet._fuente || t('r_estimado')) +
               "   ·   " + t('r_notaSemanaMes').slice(0, 80), M, y);
  y += 32;
  ctx.fillStyle = C.text; ctx.font = "700 21px " + SERIF;
  ctx.fillText(t('r_planDe') + " " + R.nombre, M, y);
  ctx.fillStyle = C.accent; ctx.font = "700 15px Inter, sans-serif";
  ctx.textAlign = "right"; ctx.fillText("COME PRO", W - M, y); ctx.textAlign = "left";

  return recortarCanvas(canvas, y + 30);
}

/* Devuelve una copia del lienzo cortada a la altura indicada */
function recortarCanvas(canvas, alturaReal){
  const alto = Math.min(canvas.height, Math.max(200, Math.round(alturaReal)));
  if(alto >= canvas.height - 2) return canvas;
  const salida = document.createElement('canvas');
  salida.width = canvas.width;
  salida.height = alto;
  salida.getContext('2d').drawImage(canvas, 0, 0);
  return salida;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' '); let line = ''; let curY = y;
  for(let n=0; n<words.length; n++){
    const test = line + words[n] + ' ';
    if(ctx.measureText(test).width > maxWidth && n>0){
      ctx.fillText(line, x, curY); line = words[n] + ' '; curY += lineHeight;
    } else { line = test; }
  }
  ctx.fillText(line, x, curY);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ============================================================
   IDIOMA — deteccion automatica
   Orden de prioridad:
     1. Lo que el usuario eligio a mano (se recuerda siempre)
     2. El idioma del telefono, si esta entre los soportados
     3. Espanol como ultimo recurso
   Ademas, al elegir un pais se cambia al idioma de ese pais,
   salvo que el usuario ya haya elegido idioma manualmente.
   ============================================================ */
const IDIOMAS_SOPORTADOS = ['es','en','pt','fr','de','it'];

/* Idioma principal de cada pais del selector */
const IDIOMA_POR_PAIS = {
  US:'en', CA:'en', GB:'en', IE:'en', BZ:'en', GY:'en',
  BR:'pt', PT:'pt',
  FR:'fr', MC:'fr', LU:'fr',
  DE:'de', AT:'de', CH:'de', LI:'de',
  IT:'it', SM:'it', VA:'it',
};

function detectarIdiomaTelefono(){
  try{
    const idiomas = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || 'es'];
    for(const l of idiomas){
      const base = String(l).toLowerCase().split('-')[0];
      if(IDIOMAS_SOPORTADOS.includes(base)) return base;
    }
  }catch(e){}
  return 'es';
}

let usuarioEligioIdioma = false;
let initLang = 'es', initTheme = 'light';
try{
  const guardado = localStorage.getItem('comepro_lang');
  if(guardado && IDIOMAS_SOPORTADOS.includes(guardado)){
    initLang = guardado;
    usuarioEligioIdioma = true;      // respeta su eleccion previa
  } else {
    initLang = detectarIdiomaTelefono();
  }
}catch(e){ initLang = detectarIdiomaTelefono(); }
try{ initTheme = localStorage.getItem('comepro_theme_v2') || 'light'; }catch(e){}

const TOTAL_STEPS = 3; // 1: datos · 2: objetivo · 3: resultado

  const label = document.getElementById('stepLabel');
  const dots = document.getElementById('stepDots');
  label.innerHTML = t('pasoDe').replace('{n}', currentStep).replace('{total}', TOTAL_STEPS) +
    (currentStep === 3 ? ` <a href="#" id="editDataLink" style="color:var(--muted); font-weight:500; text-transform:none; letter-spacing:0; margin-left:8px;">${t('btnEditarDatos')}</a>` : '');
  dots.innerHTML = Array.from({length:TOTAL_STEPS}, (_,i)=>
    `<div class="step-dot ${i < currentStep ? 'done':''}"></div>`).join('');
  const editLink = document.getElementById('editDataLink');

function showFieldError(input, message){
  clearFieldError(input);
  const err = document.createElement('div');
  err.className = 'field-error';
  err.textContent = message;
  input.insertAdjacentElement('afterend', err);
  input.style.borderColor = 'var(--pink)';
}
function clearFieldError(input){
  const next = input.nextElementSibling;
  if(next && next.classList.contains('field-error')) next.remove();
  input.style.borderColor = '';
}

function validateStep1(){
  let ok = true;
  const nombre = document.getElementById('nombre');
  const edad = document.getElementById('edad');
  const peso = document.getElementById('peso');
  const altura = document.getElementById('altura');
  [nombre, edad, peso, altura].forEach(clearFieldError);
  if(!nombre.value.trim()){ showFieldError(nombre, t('errRequerido')); ok = false; }
  const edadV = parseFloat(edad.value);
  if(!edadV || edadV < 15 || edadV > 90){ showFieldError(edad, t('errEdad')); ok = false; }
  // Se valida SOBRE EL VALOR CONVERTIDO (kg/cm), no sobre lo escrito:
  // así 175 lb es válido aunque como kg estaría fuera de rango.
  const pesoKg = getWeightKg();
  if(!pesoKg || pesoKg < 25 || pesoKg > 300){ showFieldError(peso, t('errPeso')); ok = false; }
  const alturaCm = getHeightCm();
  if(!alturaCm || alturaCm < 100 || alturaCm > 250){
    const target = unitHeight === 'ft' ? document.getElementById('alturaFt') : altura;
    showFieldError(target, t('errAltura')); ok = false;
  }
  /* Peso y altura pueden ser válidos por separado pero imposibles juntos
     (250 kg con 140 cm da un IMC de 127). Sin esta comprobación la app
     generaba planes con desvíos enormes para combinaciones que ninguna
     persona real tiene. */
  if(pesoKg && alturaCm){
    const imc = pesoKg / Math.pow(alturaCm/100, 2);
    if(imc < 10 || imc > 70){
      showFieldError(peso, t('errCombinacion')); ok = false;
    }
  }
  // El país ya no viene preseleccionado: hay que elegirlo para poder
  // calcular precios en la moneda correcta.
  const paisSel = document.getElementById('pais');
  clearFieldError(paisSel);
  if(!paisSel.value){ showFieldError(paisSel, t('errPais')); ok = false; }
  return ok;
}

function goToStep(n){
  PASO_ACTUAL = n;
  if(n === 2 && currentStep === 1 && !validateStep1()) return;
  currentStep = n;
  document.querySelectorAll('.step-pane').forEach(p=>{
    p.classList.toggle('hidden', parseInt(p.dataset.step,10) !== n);
  });
  // Al volver al formulario desde el resultado, esconde el resultado
  const resultsEl = document.getElementById('results');
  const placeholderEl = document.getElementById('placeholderSummary');
  if(n < 3){
    resultsEl.classList.add('hidden');
    placeholderEl.classList.remove('hidden');
    document.getElementById('quickNav').classList.add('hidden');
    document.body.classList.remove('has-nav');
  }
  updateStepIndicator();
  trackEvent(n===2 ? 'step_1_completed' : 'step_back', {step:n});
  window.scrollTo({top:0, behavior:'smooth'});
}

function initStepMode(){
  document.getElementById('stepIndicator').classList.remove('hidden');
  document.getElementById('btnStep1Next').classList.remove('hidden');
  document.querySelector('.step-back').classList.remove('hidden');
  document.querySelectorAll('[data-goto]').forEach(btn=>{
    btn.addEventListener('click', ()=> goToStep(parseInt(btn.dataset.goto,10)));
  });
  goToStep(1);
}

if(!SHOW_ADS) document.body.classList.add('no-ads');
const _bl = document.getElementById('brandLogo');
if(_bl) _bl.src = LOGO_OSCURO;   // versión de letras blancas
applyTheme(initTheme);
applyLanguage(initLang, !usuarioEligioIdioma);

/* Los pasos se activan SIEMPRE (Modelo 0 y Modelo 1) — el flujo por
   pasos mejora la experiencia en ambos casos. La diferencia entre
   modelos es solo QUÉ se muestra en el paso 3 (resultado):
   Modelo 0 = presupuesto + dieta completa de 30 días.
   Modelo 1 = presupuesto + embudo al influencer, sin dieta.
   Los espacios publicitarios del formulario solo salen en Modelo 1. */
initStepMode();
applyUnitsForCountry(document.getElementById('pais').value);

if(ACTIVE_INFLUENCER_SLUG){
  if(IS_MODEL_1){
    trackEvent('landing_view', {influencerId: ACTIVE_INFLUENCER.influencerId});
  } else {
    if(DEBUG_MODE) console.warn(`COME PRO: influencer "${ACTIVE_INFLUENCER_SLUG}" no encontrado — usando Modelo 0.`);
    trackEvent('landing_view', {model:0});
  }
} else {
  trackEvent('landing_view', {model:0});
}
</script>
