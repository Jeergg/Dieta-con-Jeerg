<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COME PRO — Versión prueba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0b0f0c; --surface:#121710; --surface2:#1a2117; --card:#151b13;
    --line:#26301f; --text:#f4f6f2; --muted:#8fa088;
    --accent:#7ed957; --accent2:#5fc0e8; --accent-dim:#3f7a2e;
    --pink:#ec6fa3; --purple:#8b7ce8; --orange:#f0a94e; --blue:#5b9ee8; --amber:#e8b84e;
    --radius:16px; --shadow:0 2px 14px rgba(0,0,0,.35);
  }
  [data-theme="light"]{
    --bg:#f5f7f3; --surface:#ffffff; --surface2:#f0f3ee; --card:#ffffff;
    --line:#e3e8de; --text:#1c231a; --muted:#6b7566;
    --accent:#4caf3e; --accent2:#2e9bd6; --accent-dim:#3d8a30;
    --pink:#e0568e; --purple:#7a63d6; --orange:#e08e2e; --blue:#3f7fd6; --amber:#d4a02e;
    --shadow:0 2px 14px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;}
  html, body{ max-width:100%; overflow-x:hidden; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif;
    line-height:1.5; padding-bottom:60px; transition:background .2s,color .2s; }
  img, canvas, table{ max-width:100%; }
  .amt{ overflow-wrap:anywhere; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:700; margin:0; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 16px; }

  /* Topbar */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 0; }
  .brand{ display:flex; flex-direction:column; }
  .brand-row{ display:flex; align-items:center; gap:8px; }
  .leaf{ width:30px; height:30px; }
  /* Logo con fondo propio: así "COME" se mantiene BLANCO en modo día y en
     modo noche por igual, sin quedar invisible sobre el fondo claro. */
  /* El logo va SIEMPRE en su versión de letras blancas, sobre una placa
     oscura. En modo día la cabecera de la app no es blanca sino oscura,
     así que la versión de letras negras se perdía; con la placa el logo
     se lee igual de bien en los dos temas y la marca se ve consistente. */
  /* Recuadro que destaca el botón de descargar y comprar */
  .caja-comprar{ background:rgba(143,191,111,.07); border:1.5px solid var(--accent);
    border-radius:16px; padding:16px 14px 12px; margin-top:16px; }
  /* Botón verde sólido: tiene que verse a la primera que es pulsable */
  .caja-comprar .primary, .btn-comprar{
    margin-top:0 !important; background:var(--accent) !important; color:#0e1512 !important;
    border:none !important; font-weight:800 !important; font-size:16px !important;
    padding:16px 20px !important; border-radius:14px !important;
    display:block !important; width:100% !important; text-align:center !important;
    text-decoration:none !important; box-shadow:0 4px 14px rgba(143,191,111,.28) !important;
    cursor:pointer; }
  .caja-comprar .primary:active, .btn-comprar:active{ transform:translateY(1px); }
  /* Aviso de comisión: deliberadamente discreto, casi transparente */
  .aviso-comision{ font-size:10.5px; line-height:1.4; color:var(--muted);
    opacity:.45; text-align:center; margin-top:9px; }

  .brand-logo{ height:46px; width:auto; display:block; }
  .brand-logo-wrap{ background:#141a11; border-radius:12px; padding:8px 14px;
    display:inline-flex; align-items:center; }
  .brand-plate{ display:inline-flex; align-items:center; gap:2px; background:#141a11;
    padding:5px 11px; border-radius:9px; }
  .brand-name{ font-family:'Fraunces',serif; font-size:23px; font-weight:700; letter-spacing:-.01em;
    color:#ffffff; }
  .brand-name .pro{ color:#8ce35f; }
  .brand-tag{ font-size:11.5px; color:var(--muted); margin-left:38px; margin-top:-3px; }
  .topbar-actions{ display:flex; gap:8px; align-items:center; }
  .icon-btn{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface2);
    color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .lang-pill{ display:flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--surface2);
    border-radius:20px; padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text); position:relative;}
  .lang-menu{ position:absolute; top:44px; right:0; background:var(--card); border:1px solid var(--line);
    border-radius:10px; box-shadow:var(--shadow); overflow:hidden; z-index:20; display:none; min-width:110px;}
  .lang-menu.open{ display:block; }
  .lang-menu button{ display:block; width:100%; text-align:left; padding:9px 14px; background:none; border:none;
    color:var(--text); font-size:13px; cursor:pointer; }
  .lang-menu button:hover{ background:var(--surface2); }

  /* Layout */
  .app-grid{ display:grid; grid-template-columns:1fr; gap:16px; margin-top:6px; }
  @media(min-width:900px){ .app-grid{ grid-template-columns: 1fr 1fr; align-items:start; } }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); margin-bottom:16px; }
  .card-head{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .card-head .ic{ width:22px; height:22px; color:var(--accent); flex:none; }
  .card-head h3{ font-size:15px; letter-spacing:.02em; }

  label{ display:block; font-size:12.5px; color:var(--muted); margin:14px 0 6px; font-weight:600;}
  label:first-of-type{margin-top:0;}
  input, select{
    width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:10px; font-size:15px; font-family:'Inter',sans-serif;
  }
  input:focus, select:focus{ outline:2px solid var(--accent); border-color:var(--accent); }
  input::placeholder{ color:var(--muted); opacity:.7; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:end; }
  .row2 > div{ display:flex; flex-direction:column; justify-content:flex-end; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .chip{ border:1px solid var(--line); background:var(--surface2); color:var(--muted);
    padding:8px 12px; border-radius:20px; font-size:13px; cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px;}
  .chip.active{ background:rgba(126,217,87,.15); color:var(--accent); border-color:var(--accent); font-weight:600;}
  .chip .x{ font-weight:700; }
  .chip-add{ border:1px dashed var(--line); background:transparent; color:var(--muted); }
  .segmented{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:4px;}
  .segmented.cols5{ grid-template-columns:repeat(3,1fr); }
  .seg-btn{ border:1px solid var(--line); background:var(--surface2); color:var(--muted);
    padding:12px 6px; border-radius:10px; font-size:12.5px; text-align:center; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:3px;
    min-height:52px; line-height:1.25; }
  .segmented{ align-items:stretch; }
  .seg-btn.active{ border-color:var(--accent); color:var(--accent); background:rgba(126,217,87,.12); font-weight:700;}
  button.primary{
    width:100%; margin-top:20px; background:var(--accent); color:#0b0f0c; border:none;
    padding:15px; border-radius:12px; font-size:15px; font-weight:800; cursor:pointer;
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  button.primary:active{ transform:translateY(1px); }
  .lockhint{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:10px; display:flex; align-items:center; justify-content:center; gap:5px;}

  /* Resumen stat grid */
  .stat2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat-card{ border-radius:12px; padding:14px; border:1px solid var(--line); }
  .stat-card .ic{ width:20px; height:20px; margin-bottom:8px; }
  .stat-card .val{ font-size:22px; font-weight:800; font-family:'Fraunces',serif; }
  .stat-card .lbl{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .sc-blue{ background:rgba(91,158,232,.10); } .sc-blue .ic,.sc-blue .val{ color:var(--blue); }
  .sc-green{ background:rgba(126,217,87,.10); } .sc-green .ic,.sc-green .val{ color:var(--accent); }
  .sc-orange{ background:rgba(240,169,78,.10); } .sc-orange .ic,.sc-orange .val{ color:var(--orange); }
  .sc-pink{ background:rgba(236,111,163,.10); } .sc-pink .ic,.sc-pink .val{ color:var(--pink); }
  .sc-purple{ background:rgba(139,124,232,.10); } .sc-purple .ic,.sc-purple .val{ color:var(--purple); }
  .sc-amber{ background:rgba(232,184,78,.10); } .sc-amber .ic,.sc-amber .val{ color:var(--amber); }

  /* Donut */
  .donut-row{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .donut-legend{ flex:1; min-width:140px; display:flex; flex-direction:column; gap:9px; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .legend-dot{ width:10px; height:10px; border-radius:3px; flex:none; }
  .legend-item b{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:12.5px; }

  .promedio-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .promedio-item{ text-align:center; background:var(--surface2); border-radius:10px; padding:12px 4px; }
  .promedio-item .val{ font-weight:800; font-size:16px; }
  .promedio-item .lbl{ font-size:10px; color:var(--muted); margin-top:2px; }

  .cost-card{ background:var(--card) linear-gradient(135deg, rgba(126,217,87,.10), rgba(126,217,87,.02));
    border:1px solid var(--accent-dim); color:var(--text); }
  .cost-card table.buy td, .cost-card table.buy th{ color:inherit; }
  .cost-card table.buy th{ color:var(--muted); }
  .cost-card table.buy td.num{ color:var(--text); }
  .amt{ font-family:'Fraunces',serif; font-size:38px; font-weight:800; color:var(--accent); }
  .cost-card .amt{ }
  .cost-card .sub{ font-size:12px; color:var(--muted); margin-top:2px;}
  .cost-badge{ font-size:10.5px; padding:4px 9px; border-radius:20px; background:rgba(232,184,78,.15); color:var(--amber); font-weight:700;}
  .cost-badge.verified{ background:rgba(126,217,87,.15); color:var(--accent); }
  .cost-badge.respaldo{ background:rgba(236,111,163,.15); color:var(--pink); }

  table.buy{ width:100%; border-collapse:collapse; margin-top:14px; font-size:12.5px; color:var(--text);
    table-layout:fixed; }
  table.buy td:first-child, table.buy th:first-child{ width:40%; word-break:normal;
    overflow-wrap:break-word; hyphens:none; }
  table.buy td:nth-child(2), table.buy td:nth-child(3){ text-align:center; }
  table.buy th:nth-child(2), table.buy th:nth-child(3){ text-align:center; }
  table.buy td:last-child, table.buy th:last-child{ width:24%; text-align:right; padding-right:2px; }
  /* Nada se sale de la pantalla en móvil */
  @media(max-width:420px){
    table.buy{ font-size:11.5px; }
    table.buy td, table.buy th{ padding:7px 2px; }
    .food-emoji{ margin-right:3px; }
  }
  table.buy th{ text-align:left; color:var(--muted); font-weight:600; padding:8px 4px; border-bottom:1px solid var(--line); font-size:9.5px; text-transform:uppercase; letter-spacing:.02em; vertical-align:bottom; line-height:1.25;}
  table.buy td{ padding:10px 4px; border-bottom:1px solid var(--line); color:var(--text); vertical-align:middle;}
  table.buy td.num{ text-align:right; font-family:'IBM Plex Mono',monospace; color:var(--text);}
  .food-emoji{ font-size:15px; margin-right:6px; }
  .food-state{ font-size:10px; color:var(--muted); font-style:italic; white-space:nowrap; }
  .cart-btn{ width:100%; margin:0 0 14px; padding:14px 12px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-family:'Inter',sans-serif; font-size:14.5px;
    font-weight:800; cursor:pointer; display:flex; flex-direction:column; align-items:center;
    gap:2px; box-shadow:0 2px 10px rgba(76,175,62,.28); }
  .cart-btn span{ font-size:11px; font-weight:500; opacity:.9; }
  .cart-btn:active{ transform:translateY(1px); }
  .cart-btn:disabled{ opacity:.65; cursor:default; }
  .condimentos-line{ font-size:11.5px; color:var(--muted); opacity:.8; margin-top:2px; }
  .condimentos-line b{ color:var(--muted); font-weight:600; }
  .objetivo-diario-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:8px; }
  .secondary-stats{ display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; padding-top:10px;
    border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }
  .secondary-stats b{ color:var(--text); font-weight:700; }
  .warn-medical{ border-left:4px solid var(--amber); line-height:1.45; }
  .meal-block{ margin-bottom:12px; padding-bottom:10px; border-bottom:1px dashed var(--line); }
  .meal-block:last-of-type{ border-bottom:none; }
  .meal-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:5px; }
  .meal-label{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--accent); font-weight:700; }
  .dish-name{ font-family:'Fraunces',serif; font-size:14px; font-weight:700; color:var(--text); }
  .prep-block{ margin-top:6px; }
  .prep-block summary{ font-size:11.5px; color:var(--accent); cursor:pointer; font-weight:600; list-style:none; }
  .prep-block summary::-webkit-details-marker{ display:none; }
  .prep-block summary::before{ content:"👨‍🍳 "; }
  .prep-block p{ font-size:12px; color:var(--muted); line-height:1.5; margin:6px 0 0;
    background:var(--surface2); padding:10px 12px; border-radius:8px; }

  .download-btn{ width:100%; margin-top:14px; background:var(--surface2); border:1px solid var(--accent-dim);
    color:var(--accent); padding:13px; border-radius:12px; font-size:13.5px; font-weight:700; cursor:pointer;
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; gap:8px; }
  .download-btn:active{ transform:translateY(1px); }

  .feature-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:16px; }
  @media(min-width:500px){ .feature-grid{ grid-template-columns:repeat(4,1fr); } }
  .feature-item{ text-align:center; background:var(--surface2); border-radius:12px; padding:14px 8px; }
  .feature-item .ic{ width:22px; height:22px; margin:0 auto 8px; color:var(--accent); }
  .feature-item .txt{ font-size:11.5px; font-weight:600; }

  .steps-card{ display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between; }
  .steps-title h2{ font-size:19px; color:var(--accent); }
  .steps-title p{ font-size:12px; color:var(--muted); margin:2px 0 0; }
  .steps-flow{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .step-item{ display:flex; align-items:center; gap:9px; }
  .step-num{ width:26px; height:26px; border-radius:50%; background:var(--accent); color:#0b0f0c; font-weight:800;
    display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }
  .step-txt b{ display:block; font-size:12.5px; } .step-txt span{ font-size:10.5px; color:var(--muted); }
  .step-arrow{ color:var(--muted); }

  .hint{ font-size:11.5px; color:var(--muted); margin-top:6px; }
  .note{ font-size:12px; color:var(--muted); background:var(--surface2); border-left:3px solid var(--accent-dim);
    padding:10px 12px; border-radius:6px; margin-top:14px; }
  .warn-box{ background:rgba(232,184,78,.10); border:1px solid var(--amber); border-radius:8px; padding:10px 12px;
    font-size:12px; color:var(--text); margin-top:8px; }
  .hidden{ display:none !important; }
  body.no-ads .ad-slot{ display:none !important; }
  .ad-slot{ border:1px dashed var(--line); border-radius:10px; padding:20px 14px; text-align:center;
    color:var(--muted); font-size:11px; margin:20px 0; background:transparent; min-height:60px;
    display:flex; align-items:center; justify-content:center; }
  .ad-label{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.16em;
    text-transform:uppercase; opacity:.6; }
  .affiliate-tag{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; font-family:'IBM Plex Mono',monospace;}
  .affiliate-card{ display:flex; gap:12px; align-items:center; background:var(--surface2); border:1px solid var(--line);
    border-radius:10px; padding:12px; margin-top:8px; text-decoration:none; color:var(--text);}
  .affiliate-card .emoji{ font-size:24px; }
  .affiliate-card .info b{ display:block; font-size:13.5px; } .affiliate-card .info span{ font-size:11.5px; color:var(--muted); }
  .day-card{ border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:10px; background:var(--surface2);}
  .week-block{ border:1px solid var(--line); border-radius:12px; margin-top:10px; overflow:hidden; }
  .week-block summary{ padding:14px 16px; cursor:pointer; font-weight:700; font-size:14px; color:var(--text);
    background:var(--surface2); list-style:none; display:flex; justify-content:space-between; align-items:center; }
  .week-block summary::-webkit-details-marker{ display:none; }
  .week-block summary::after{ content:"▾"; color:var(--muted); margin-left:8px; }
  .week-block[open] summary::after{ content:"▴"; }
  .day-card h4{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); margin:0 0 8px; letter-spacing:.05em;}
  .meal{ font-size:13px; margin-bottom:6px; } .meal b{ color:var(--text); } .meal span{ color:var(--muted); }
  .food-chip{ display:inline-flex; align-items:center; gap:3px; background:var(--surface2); border-radius:6px;
    color:var(--text);
    padding:2px 4px 2px 7px; margin:2px 3px 2px 0; }
  .swap-btn{ border:none; background:none; cursor:pointer; font-size:12px; padding:2px 4px; line-height:1; opacity:.75; }
  .swap-btn:active{ opacity:1; }
  .swap-select{ font-size:12.5px; padding:4px 6px; border-radius:6px; border:1px solid var(--accent);
    background:var(--surface2); color:var(--text); }
  .day-totals{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:11.5px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap;}
  canvas.render-canvas{ width:100%; border-radius:10px; margin-top:12px; border:1px solid var(--line); }
  .footer-note{ text-align:center; color:var(--muted); font-size:11px; margin-top:26px; padding:0 16px; }
  .privacy-link{ color:var(--muted); text-decoration:underline; }
  .placeholder-summary{ text-align:center; padding:18px 16px; color:var(--muted); font-size:12.5px;
    display:flex; align-items:center; gap:12px; text-align:left; }
  .placeholder-summary .ic{ width:26px; height:26px; margin:0; opacity:.5; flex:none; }
  .placeholder-summary p{ margin:0; }

  /* Pasos (Modelo 1) */
  .step-indicator{ margin-bottom:14px; }
  .step-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:7px; }
  .step-dots{ display:flex; gap:6px; }
  .step-dot{ height:4px; flex:1; border-radius:4px; background:var(--line); transition:background .25s; }
  .step-dot.done{ background:var(--accent); }
  .step-pane{ animation:stepIn .28s ease; }
  @keyframes stepIn{ from{ opacity:0; transform:translateX(14px);} to{ opacity:1; transform:none;} }
  .step-back{ width:100%; margin-top:10px; background:none; border:none; color:var(--muted);
    font-size:13px; cursor:pointer; padding:10px; font-family:'Inter',sans-serif; }
  .field-error{ color:var(--pink); font-size:11.5px; margin-top:4px; font-weight:600; }
  .unit-switch{ display:inline-flex; background:var(--surface2); border:1px solid var(--line);
    border-radius:8px; padding:2px; margin-top:7px; gap:2px; }
  .unit-opt{ border:none; background:transparent; color:var(--muted); font-size:11.5px; font-weight:700;
    padding:5px 12px; border-radius:6px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .15s; }
  .unit-opt.active{ background:var(--accent); color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.15); }

  /* Navegación rápida fija (punto 6: reducir scroll y ruido visual) */
  .quicknav{ position:fixed; bottom:0; left:0; right:0; z-index:60; display:flex;
    background:var(--card); border-top:1px solid var(--line); box-shadow:0 -2px 14px rgba(0,0,0,.10);
    padding:env(safe-area-inset-bottom) 0 0; }
  .quicknav a{ flex:1; text-align:center; padding:11px 3px calc(11px + env(safe-area-inset-bottom));
    font-size:11px; font-weight:700; color:var(--muted); text-decoration:none; }
  .quicknav a:active{ color:var(--accent); }

let CURRENT_LANG = "es";
function t(key){ return (STR[CURRENT_LANG] && STR[CURRENT_LANG][key]) || STR.es[key] || key; }
function applyLanguage(lang, automatico){
  /* automatico = true  -> viene de la deteccion del telefono o del pais,
                            NO se guarda como preferencia del usuario.
     automatico = false -> el usuario lo eligio a mano: se guarda y a
                            partir de ahi manda sobre la deteccion. */
  CURRENT_LANG = lang;
  if(!automatico){
    try{ localStorage.setItem('comepro_lang', lang); }catch(e){}
    usuarioEligioIdioma = true;
  }
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
  document.getElementById('langPillLabel').textContent = lang.toUpperCase();
  populateCountrySelect();
  updatePriceHint();
  renderAllergyChips();
}

/* Theme toggle */
function applyTheme(theme){
  document.body.dataset.theme = theme;
  // La cabecera cambia sola por CSS. Aqui solo se actualiza el logo
  // que se dibuja dentro de la imagen descargable.
  try{ if(LOGO_IMG) LOGO_IMG.src = logoActual(); }catch(e){}
  try{ localStorage.setItem('comepro_theme_v2', theme); }catch(e){}
  document.getElementById('themeIconSun').classList.toggle('hidden', theme==='light');
  document.getElementById('themeIconMoon').classList.toggle('hidden', theme==='dark');
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  applyTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
});
document.getElementById('langPillBtn').addEventListener('click', ()=>{
  document.getElementById('langMenu').classList.toggle('open');
});
document.querySelectorAll('#langMenu button').forEach(b=>{
  b.addEventListener('click', ()=>{ applyLanguage(b.dataset.lang); document.getElementById('langMenu').classList.remove('open'); });
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('#langPillBtn') && !e.target.closest('#langMenu')) document.getElementById('langMenu').classList.remove('open');
});

function trackEvent(eventName, data){
  const payload = {
    event: eventName,
    influencerId: ACTIVE_INFLUENCER ? ACTIVE_INFLUENCER.influencerId : null,
    sessionId: SESSION_ID,
    timestamp: new Date().toISOString(),
    ...data,
  };
  if(DEBUG_MODE) console.log('[COME PRO]', JSON.stringify(payload));
  try{
    const log = JSON.parse(localStorage.getItem('comepro_events') || '[]');
    log.push(payload);
    localStorage.setItem('comepro_events', JSON.stringify(log.slice(-200))); // conserva solo los últimos 200
  }catch(e){}
}

   Redondea SIEMPRE hacia arriba a unidades enteras cuando el producto se
   vende por pieza/lata/paquete; el consumo nutricional no se altera. */
function purchaseUnits(gramsNeeded, foodId){
  const f = FOODS[foodId];
  const raw = gramsNeeded / f.gPerUnit;
  return Math.max(1, Math.ceil(raw));
}

let countrySearchTerm = "";
function populateCountrySelect(){
  const sel = document.getElementById('pais');
  const prevValue = sel.value || "";
  const term = countrySearchTerm.trim().toLowerCase();
  const regions = [];
  COUNTRIES.forEach(c=>{ if(!regions.includes(c.region)) regions.push(c.region); });
  const placeholder = `<option value="" disabled ${prevValue ? '' : 'selected'}>${t('phSeleccionaPais')}</option>`;
  sel.innerHTML = placeholder + regions.map(region=>{
    const list = COUNTRIES.filter(c=> c.region===region).filter(c=>{
      if(!term) return true;
      const name = (CURRENT_LANG==='en'? c.en : c.es).toLowerCase();
      return name.includes(term) || c.code.toLowerCase().includes(term);
    });
    if(!list.length) return '';
    const opts = list.map(c=>{
      const name = CURRENT_LANG === 'en' ? c.en : c.es;
      return `<option value="${c.code}">${name} — ${c.symbol}</option>`;
    }).join('');
    return `<optgroup label="${region}">${opts}</optgroup>`;
  }).join('');
  if([...sel.options].some(o=>o.value===prevValue)) sel.value = prevValue;
}

let pricesLoadedLive = false;
async function loadLivePrices(){
  try{
    const res = await fetch('prices.json', {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    // Validación básica de estructura antes de usar el archivo — si algo
    // no tiene la forma esperada, se descarta y se usa el respaldo local
    // en vez de arriesgarse a mostrar datos corruptos o incompletos.
    if(!data || typeof data !== 'object' || !data.countries || typeof data.countries !== 'object'){
      throw new Error("prices.json tiene una estructura inválida");
    }
    const rebuilt = {};
    Object.keys(data.countries).forEach(code=>{
      const c = data.countries[code];
      if(!c || !c.items || typeof c.items !== 'object' || !c.symbol) return; // país mal formado, se omite
      const items = Object.keys(c.items).filter(id => c.items[id] && typeof c.items[id].value === 'number');
      const verifiedCount = items.filter(id => {
        const src = (c.items[id].source || "").toLowerCase();
        return src && !src.includes("estimado");
      }).length;
      const confidencePct = items.length ? Math.round((verifiedCount/items.length)*100) : 0;
      rebuilt[code] = { symbol: c.symbol, _fuente: `Actualizado ${data.updated_at}`, _confidencePct: confidencePct };
      items.forEach(foodId=>{ rebuilt[code][foodId] = c.items[foodId].value; });
    });
    if(Object.keys(rebuilt).length === 0){ throw new Error("prices.json no contiene países válidos"); }
    PRICES = rebuilt;
    pricesLoadedLive = true;
  }catch(e){
    if(DEBUG_MODE) console.warn("COME PRO: prices.json no disponible, usando respaldo local.", e);
    pricesLoadedLive = false;
  }
  updatePriceHint();
}
loadLivePrices();

/* ============================================================
   2) PLANTILLA DE CICLO DE 7 DÍAS
   ============================================================ */
/* "huevo" no se usa aquí — el desayuno ya usa huevo todos los días, así
   que repetirlo en almuerzo/cena generaba días con muy poca densidad de
   proteína (2 comidas de huevo el mismo día) y esos días fallaban el
   objetivo de proteína.
   Almuerzo y cena usan DOS listas separadas (no una sola rotada) para
   garantizar que NUNCA coincidan el mismo día — si coincidían (ej. carne
   molida en almuerzo Y cena), se duplicaba la grasa de golpe y el día
   fallaba el objetivo de grasa por mucho margen. */
/* VARIEDAD EN 30 DÍAS
   Antes cada arreglo tenía 7 posiciones, así que los 30 días eran la
   misma semana repetida ~4 veces. Ahora cada categoría rota con una
   longitud distinta (7, 5, 4, 6, 3...). Como esas longitudes no encajan
   entre sí, las combinaciones tardan mucho más en repetirse: el día 8
   ya no es igual al día 1. Se mantiene la coherencia nutricional (misma
   categoría en el mismo puesto) y económica (mismos alimentos base). */
const LUNCH_PROTEIN  = ["pollo","carne","atun","pollo","carne","atun","pollo"];      // 7
const DINNER_PROTEIN = ["carne","atun","pollo","carne","atun"];                       // 5

   pasta). La avena quedó fuera: su tope práctico es 150 g, insuficiente
   para sostener objetivos altos de carbohidratos — los días que la usaban
   como base no alcanzaban la meta (se topaban al 5% por debajo). Ahora la
   avena aparece en el desayuno, que es su uso natural. */
const CARB_STAPLE    = ["arroz","pasta","arroz","pasta","arroz"];                     // 5

  const lang = CURRENT_LANG === 'en' ? 'en' : 'es';
  const prot = items.find(it=> FOODS[it.id].cat === 'protein' && it.id !== 'huevo');
  const carb = items.find(it=> FOODS[it.id].cat === 'carb' && ['arroz','pasta'].includes(it.id));
  if(prot && carb){
    const key = `${prot.id}|${carb.id}`;
    if(DISH_NAMES[key]){
      return { name: DISH_NAMES[key][lang], prep: (DISH_PREP[key]||{})[lang] || '' };
    }
  }
  const g = GENERIC_DISH[mealKey] || GENERIC_DISH.almuerzo;
  const p = GENERIC_PREP[mealKey];
  return { name: g[lang], prep: p ? p[lang] : '' };
}

/* ============================================================
   UNIDADES POR PAÍS (punto 6)
   EE.UU. usa libras y pies/pulgadas; el resto del mundo, kg y cm.
   La unidad se preselecciona según el país elegido, pero el usuario
   siempre puede cambiarla manualmente tocando el botón junto al campo.
   Internamente TODO se convierte a kg y cm antes de calcular, así el
   BMR/TDEE no cambia por el país elegido — solo cambia cómo se escribe.
   ============================================================ */
const IMPERIAL_COUNTRIES = ["US","PR"]; // libras y pies/pulgadas por defecto

/* ============================================================
   COMPRAR LISTA COMPLETA (Instacart)
   ------------------------------------------------------------
   A diferencia de Walmart, Instacart SI permite generar una lista
   de compra completa desde un enlace: el usuario recibe todos sus
   alimentos con sus cantidades reales, elige su supermercado y
   paga alli. Por eso es un solo boton, no uno por alimento.

   *** PARA ACTIVARLO ***
   1. Registrate en el Instacart Developer Platform y solicita
      acceso (requiere ser empresa o residente de EE.UU./Canada).
   2. La API necesita una clave SECRETA, y una pagina estatica no
      puede guardarla sin exponerla. Hace falta una funcion
      serverless (Vercel/Netlify tienen plan gratuito) que reciba
      la lista, llame a Instacart y devuelva la URL generada.
   3. Pon la direccion de esa funcion en CART_API_ENDPOINT.
   Mientras este vacio, el boton NO se muestra.
   ============================================================ */

/* ============================================================
   SUPERMERCADOS POR PAÍS
   Cada país muestra el botón de su propio supermercado con TU enlace
   de afiliado. Las comisiones van siempre a tu cuenta; al influencer
   se le paga su porcentaje aparte.

   *** CÓMO ACTIVAR CADA UNO ***
   Pega tu enlace en "url" y cambia "activo" a true. Mientras esté en
   false, el botón no aparece en ese país: es preferible no mostrar
   nada a mostrar un botón que no genera comisión.

   El enlace puede llevar {q} donde quieras que se inserte la búsqueda
   del alimento; si no lo lleva, se abre la página principal.
   ============================================================ */
const SUPERMERCADOS = {
  US: { nombre:"Instacart",     url:"", activo:false, nota:"pendiente de aprobación" },
  DE: { nombre:"REWE",          url:"", activo:false, nota:"pendiente" },
  NL: { nombre:"Picnic",        url:"", activo:false, nota:"pendiente" },
  GB: { nombre:"Iceland Foods", url:"", activo:false, nota:"pendiente" },
  FR: { nombre:"Jow",           url:"", activo:false, nota:"pendiente" },
  ES: { nombre:"Carrefour",     url:"", activo:false, nota:"pendiente" },
};

/* Devuelve el supermercado del país si está activo y con enlace */
function supermercadoDe(codigoPais){
  const s = SUPERMERCADOS[codigoPais];
  if(!s || !s.activo || !s.url) return null;
  return s;
}

/* Abre el supermercado del país con la lista de la compra */
function abrirSupermercado(R){
  const s = supermercadoDe(R.country);
  if(!s) return;
  enviarEvento('supermercado', Object.assign(datosPerfil(R), {detalle: s.nombre}));
  let url = s.url;
  if(url.indexOf('{q}') !== -1){
    // Buscar el primer alimento de la lista, en inglés si existe
    const primero = R.purchase[0];
    const termino = primero ? (CART_SEARCH[primero.id] || primero.name) : '';
    url = url.replace('{q}', encodeURIComponent(termino));
  }
  const w = window.open(url, '_blank', 'noopener');
  if(!w) mostrarEnlaceRespaldo(url);
}


const CART_API_ENDPOINT = "";        // <-- URL de tu funcion serverless

/* ============================================================
   *** MODO PRUEBA — QUITAR ANTES DE PUBLICAR ***
   Con esto en true, el boton abre la pagina general de Instacart
   en lugar de una lista generada con tus alimentos. Sirve solo
   para ver como se siente el flujo completo:
     descargar -> abrir Instacart -> pantalla del influencer
   NO lleva tus alimentos ni genera comision.
   Ponlo en false (o borra este bloque) cuando conectes la API real.
   ============================================================ */
const CART_MODO_PRUEBA = true;
const CART_URL_PRUEBA = "https://www.instacart.com/store";
const CART_COUNTRIES = ["US"];       // solo se muestra en estos paises

/* Nombre en ingles de cada alimento, para que el catalogo de
   Instacart pueda encontrarlo (no reconoce "guineo maduro"). */
const CART_SEARCH = {
  pollo:"chicken breast", carne:"ground beef 90/10", huevo:"eggs", atun:"canned tuna in water",
  salmon:"salmon fillet",
  habichuelas:"red kidney beans", lentejas:"dry lentils", arroz:"white rice", papa:"potatoes", batata:"sweet potato", avena:"rolled oats", pasta:"pasta",
  aguacate:"avocado", aceite:"olive oil", frutos_secos:"mixed nuts", semillas:"chia seeds",
  brocoli:"broccoli", espinaca:"spinach", tomate:"tomatoes", cebolla:"onions", berenjena:"eggplant", ajiRojo:"red bell pepper",
  remolacha:"beets", zanahoria:"carrots", manzana:"apples", naranja:"oranges", pina:"pineapple",
  sandia:"watermelon", fresas:"strawberries", ciruelasPasas:"prunes", guineoMaduro:"bananas",
  ajo:"garlic", canela:"ground cinnamon", sal:"salt", cafe:"ground coffee", limon:"lemons",
};

/* Dirección de la tienda que corresponde al país, ya con la búsqueda
   insertada si el enlace la admite. Se calcula al dibujar el resultado
   para poder ponerla en el href del botón. */
/* Crea un botón de descarga. Si el país tiene tienda, devuelve un
   enlace <a href> real en vez de un <button>: el navegador lo trata
   como navegación iniciada por la persona, así que se abre incluso
   dentro de Instagram y nunca aparece una pestaña en blanco.
   Todos los botones de descarga usan esta función, para que se
   comporten igual y lleven siempre el aviso de comisión. */
function botonDescarga(R, id, texto){
  const u = urlTiendaDe(R);
  const aviso = '<div class="aviso-comision">' + t('r_avisoComision') + '</div>';
  const etiqueta = texto || t('r_descargarCompra');
  const cuerpo = u
    ? '<a class="btn-comprar" id="' + id + '" href="' + u + '" target="_blank" rel="noopener">' +
      etiqueta + '</a>'
    : '<button type="button" class="btn-comprar" id="' + id + '">' + etiqueta + '</button>';
  return '<div class="caja-comprar">' + cuerpo + aviso + '</div>';
}

function urlTiendaDe(R){
  const sp = supermercadoDe(R.country);
  if(sp){
    let u = sp.url;
    if(u.indexOf('{q}') !== -1){
      const pr = R.purchase[0];
      u = u.replace('{q}', encodeURIComponent(pr ? (CART_SEARCH[pr.id] || pr.name) : ''));
    }
    return u;
  }
  if(CART_MODO_PRUEBA && !CART_API_ENDPOINT && CART_COUNTRIES.includes(R.country)){
    return CART_URL_PRUEBA;
  }
  return '';
}

function showCartButton(countryCode){
  /* El botón aparece si el país tiene supermercado configurado, o si
     sigue activo el modo prueba de Instacart. */
  if(supermercadoDe(countryCode)) return true;
  return (!!CART_API_ENDPOINT || CART_MODO_PRUEBA) && CART_COUNTRIES.includes(countryCode);
}

/* Envia la lista real del usuario (con SUS cantidades) y abre la
   pagina de compra generada. Cada dieta manda cifras distintas. */
let unitWeight = 'kg', unitHeight = 'cm';

function applyUnitsForCountry(code){
  if(!code) return; // sin país elegido, se mantiene kg/cm
  const imperial = IMPERIAL_COUNTRIES.includes(code);
  /* IMPORTANTE: el país solo PRESELECCIONA la unidad cuando el campo
     todavía está vacío. Si la persona ya escribió su peso o su altura,
     no se toca nada: convertir automáticamente hacía que el número
     cambiara solo en pantalla (80 -> 176.4) y parecía un error, además
     de arruinar el dato si lo había escrito pensando en otra unidad.
     Para cambiar de unidad a propósito están los botones kg/lb. */
  const pesoInput = document.getElementById('peso');
  const alturaInput = document.getElementById('altura');
  const ftInput = document.getElementById('alturaFt');

  const pesoVacio = !pesoInput || !pesoInput.value;
  const alturaVacia = (!alturaInput || !alturaInput.value) && (!ftInput || !ftInput.value);

  if(pesoVacio) setWeightUnit(imperial ? 'lb' : 'kg');
  if(alturaVacia) setHeightUnit(imperial ? 'ft' : 'cm');
}
function setWeightUnit(u){
  if(u === unitWeight) return;
  // Convierte el peso ya escrito en vez de dejarlo mal interpretado
  const inp = document.getElementById('peso');
  if(inp){
    const v = parseFloat(inp.value);
    if(v > 0){
      if(u === 'lb' && unitWeight === 'kg') inp.value = Math.round(v / 0.45359237 * 10) / 10;
      else if(u === 'kg' && unitWeight === 'lb') inp.value = Math.round(v * 0.45359237 * 10) / 10;
    }
  }
  unitWeight = u;
  document.querySelectorAll('#pesoUnitSwitch .unit-opt').forEach(b=>{
    b.classList.toggle('active', b.dataset.unit === u);
  });
}
function setHeightUnit(u){
  if(u === unitHeight) return;
  const cmInput = document.getElementById('altura');
  const ftI = document.getElementById('alturaFt');
  const inI = document.getElementById('alturaIn');
  /* CONVERTIR el valor ya escrito en vez de perderlo.
     Antes solo se ocultaban/mostraban campos: si escribías 175 cm y
     cambiabas a pies, el dato desaparecía. */
  if(cmInput && ftI && inI){
    if(u === 'ft' && unitHeight === 'cm'){
      const cm = parseFloat(cmInput.value);
      if(cm > 0){
        const totalIn = cm / 2.54;
        let ft = Math.floor(totalIn / 12);
        let inch = Math.round(totalIn - ft*12);
        if(inch === 12){ ft += 1; inch = 0; }
        ftI.value = ft; inI.value = inch;
      }
    } else if(u === 'cm' && unitHeight === 'ft'){
      const ft = parseFloat(ftI.value) || 0;
      const inch = parseFloat(inI.value) || 0;
      if(ft || inch) cmInput.value = Math.round((ft*12 + inch) * 2.54);
    }
  }
  unitHeight = u;
  document.querySelectorAll('#alturaUnitSwitch .unit-opt').forEach(b=>{
    b.classList.toggle('active', b.dataset.unit === u);
  });
  if(cmInput && document.getElementById('ftInRow')){
    cmInput.classList.toggle('hidden', u === 'ft');
    document.getElementById('ftInRow').classList.toggle('hidden', u !== 'ft');
  }
}
/* Devuelve SIEMPRE kg, sin importar cómo lo escribió el usuario */
function getWeightKg(){
  const v = parseFloat(document.getElementById('peso').value);
  if(!v) return NaN;
  return unitWeight === 'lb' ? v * 0.45359237 : v;
}
/* Devuelve SIEMPRE cm */
function getHeightCm(){
  if(unitHeight === 'ft'){
    const ft = parseFloat(document.getElementById('alturaFt').value) || 0;
    const inch = parseFloat(document.getElementById('alturaIn').value) || 0;
    if(!ft && !inch) return NaN;
    return (ft * 12 + inch) * 2.54;
  }
  const v = parseFloat(document.getElementById('altura').value);
  return v || NaN;
}

/* La cena nunca repite la proteína del almuerzo: con las rotaciones de
   longitud 7 y 5 coincidían 11 de los 30 días (pollo en almuerzo Y cena),
   lo que reduce la variedad y desbalancea la grasa cuando toca carne. */
/* Proteina de la merienda: evita repetir la que ya se usa en almuerzo
   o cena ese mismo dia. Con atun fijo se repetia 22 de los 30 dias. */
function proteinaMerienda(d){
  // El desayuno SIEMPRE lleva huevo, asi que tampoco se repite aqui.
  const usadas = [LUNCH_PROTEIN[d % LUNCH_PROTEIN.length], proteinaCena(d), "huevo"];
  const opciones = ["atun", "pollo", "carne"];
  const libres = opciones.filter(p => !usadas.includes(p));
  return libres.length ? libres[d % libres.length] : "atun";
}

function proteinaCena(d){
  const delAlmuerzo = LUNCH_PROTEIN[d % LUNCH_PROTEIN.length];
  let elegida = DINNER_PROTEIN[d % DINNER_PROTEIN.length];
  if(elegida === delAlmuerzo){
    const alternativas = DINNER_PROTEIN.filter(p => p !== delAlmuerzo);
    if(alternativas.length) elegida = alternativas[d % alternativas.length];
  }
  return elegida;
}

/* El desayuno no repite el carbohidrato del almuerzo (el arroz aparecía
   en ambas comidas 6 días de cada 30). */
function carboDesayuno(d){
  const delAlmuerzo = CARB_STAPLE[d % CARB_STAPLE.length];
  let elegido = CARB_BREAKFAST[d % CARB_BREAKFAST.length];
  if(elegido === delAlmuerzo){
    const alternativas = CARB_BREAKFAST.filter(c => c !== delAlmuerzo);
    if(alternativas.length) elegido = alternativas[d % alternativas.length];
  }
  return elegido;
}

function buildDayTemplate(dayIdx){
  const d = dayIdx; // índice absoluto: cada categoría rota con su propia longitud
  const tmpl = {
    /* REPARTO DE PROTEINA ENTRE COMIDAS
       La sintesis proteica se activa por encima de ~25 g de proteina por
       toma y se satura hacia los 40 g: concentrar 80 g en el almuerzo
       desperdicia parte de ese aporte mientras el desayuno se queda corto.
       Se reparte en tomas mas parejas para cruzar el umbral 3-4 veces al
       dia, que es lo que la evidencia asocia a mejor retencion muscular. */
    desayuno: [ {id:"huevo", baseG:170}, {id:carboDesayuno(d), baseG:50},
                {id:FRUIT_ROT[d % FRUIT_ROT.length], baseG:150} ],
    almuerzo: [ {id:LUNCH_PROTEIN[d % LUNCH_PROTEIN.length], baseG:120},
                {id:CARB_STAPLE[d % CARB_STAPLE.length], baseG:130},
                {id:CARB_SIDE[d % CARB_SIDE.length], baseG:80},
                {id:VEG_ROT[d % VEG_ROT.length], baseG:180}, {id:"aceite", baseG:8} ],
    /* La merienda llevaba solo grasa y fruta (2-3 g de proteína). El ISSN
       recomienda repartir la proteína en tomas de 20-40 g a lo largo del
       día para maximizar la síntesis proteica, así que ahora incluye una
       fuente proteica. */
    merienda: [ {id:FAT_ROT[d % FAT_ROT.length], baseG:25},
                {id:proteinaMerienda(d), baseG:90},
                {id:(d % 5 === 0 ? "ciruelasPasas" : FRUIT_ROT2[d % FRUIT_ROT2.length]), baseG: d % 5 === 0 ? 30 : 120} ],
    cena:     [ {id:proteinaCena(d), baseG:150},
                {id:VEG_ROT2[d % VEG_ROT2.length], baseG:180}, {id:"aceite", baseG:6} ],
    condimentos: [ {id:"cafe", baseG:10}, {id:"sal", baseG:3}, {id:"ajo", baseG:5},
                   {id:"canela", baseG: d%2===0?2:0}, {id:"limon", baseG:20} ].filter(it=>it.baseG>0),
  };
  // ID estable por posición (no por índice de arreglo), para que "cambiar
  // alimento" siempre encuentre el elemento correcto aunque otros se hayan
  // quitado del arreglo por quedar en 0 g.
  MEAL_KEYS.forEach(meal=>{ tmpl[meal].forEach((it,i)=>{ it.slotId = `${meal}-${i}`; }); });
  return tmpl;
}
function macrosOf(foodId, grams){
  const f = FOODS[foodId]; const factor = grams/100;
  return { kcal:f.kcal*factor, p:f.p*factor, c:f.c*factor, f:f.f*factor };
}
/* Porción máxima razonable por plato para cada alimento (evita cosas como
   "430 g de avena en el desayuno"). Si el ajuste matemático pide más que
   esto, el sobrante se reparte hacia otro alimento de la misma categoría
   ese mismo día, en vez de amontonarlo todo en un solo ingrediente. */
const MAX_SERVING = {
  pollo:420, carne:420, atun:380, huevo:280, salmon:350,
  /* Topes de carbohidratos subidos: con objetivos altos (4000+ kcal) los
     dias que combinaban avena + pasta se quedaban hasta 18% por debajo
     porque TODOS sus alimentos tocaban el maximo a la vez. Estas cifras
     siguen siendo porciones realistas en peso seco para alguien de
     120-130 kg que entrena fuerte. */
  arroz:380, avena:200, pasta:320, habichuelas:200, lentejas:200, papa:450, batata:450,
  aceite:45, aguacate:280, frutos_secos:90, semillas:60,
};
/* Los topes de porción están pensados para un día de ~2600 kcal.
   Alguien que necesita 4700 kcal come porciones proporcionalmente
   mayores: con topes fijos, esos perfiles se quedaban hasta un 16%
   por debajo de su objetivo porque ningún alimento podía crecer más.
   El factor se limita a 2x para que no produzca cantidades absurdas. */
let CAP_FACTOR = 1;
function capFor(id){
  const base = MAX_SERVING[id];
  return base ? base * CAP_FACTOR : null;
}

function capAndRedistribute(allItems, category){
  const catItems = allItems.filter(it=> FOODS[it.id].cat === category);
  let overflow = 0;
  catItems.forEach(it=>{
    const cap = capFor(it.id);
    if(cap && it.g > cap){ overflow += (it.g - cap); it.g = cap; }
  });
  if(overflow > 0.5){
    const receivers = catItems.filter(it=> !capFor(it.id) || it.g < capFor(it.id));
    if(receivers.length){
      const share = overflow / receivers.length;
      receivers.forEach(it=>{
        const cap = capFor(it.id);
        let newG = it.g + share;
        if(cap) newG = Math.min(newG, cap);
        it.g = Math.max(0, Math.round(newG/5)*5);
      });
    }
  }
}

/* Escala proteína, carbohidratos y grasas hacia sus propios objetivos en
   gramos. Se hace en VARIAS PASADAS (no una sola): cada macro influye un
   poco en los otros (el arroz también aporta proteína, la carne también
   aporta grasa), así que se itera hasta que el resultado converge cerca
   del objetivo real — la misma corrección que señaló la auditoría. */
function scaleDayToTarget(template, targetKcal, targetProtein, targetCarb, targetFat){
  // Escala los topes según cuánta comida necesita realmente esta persona
  /* Techo de 3x (antes 2x): con objetivos de 7000-8000 kcal (personas de
     mucho peso y muy activas) los alimentos topaban y el día se quedaba
     hasta un 15% corto. */
  CAP_FACTOR = Math.min(3, Math.max(1, targetKcal / 2600));
  const allItems = allDayItems(template);
  allItems.forEach(it=>{ it.g = it.baseG; });

  const ITERATIONS = 4;
  for(let iter=0; iter<ITERATIONS; iter++){
    // Proteína: usa el estado más reciente de carbohidratos/grasas/veg/fruta/condimentos
    const proteinItems = allItems.filter(it=> FOODS[it.id].cat === "protein");
    const nonProteinP = allItems.filter(it=> FOODS[it.id].cat !== "protein").reduce((s,it)=> s + macrosOf(it.id, it.g).p, 0);
    const baseProteinP = proteinItems.reduce((s,it)=> s + macrosOf(it.id, it.baseG).p, 0);
    const remainingProteinTarget = Math.max(0, targetProtein - nonProteinP);
    let proteinScale = baseProteinP>0 ? remainingProteinTarget/baseProteinP : 1;
    proteinScale = Math.max(0.2, Math.min(proteinScale, 5.0));
    proteinItems.forEach(it=>{ it.g = Math.max(0, Math.round((it.baseG*proteinScale)/5)*5); });

    // Carbohidratos: usa la proteína recién actualizada + grasas/veg/fruta del estado actual
    const carbItems = allItems.filter(it=> FOODS[it.id].cat === "carb");
    const nonCarbC = allItems.filter(it=> FOODS[it.id].cat !== "carb").reduce((s,it)=> s + macrosOf(it.id, it.g).c, 0);
    const baseCarbC = carbItems.reduce((s,it)=> s + macrosOf(it.id, it.baseG).c, 0);
    const remainingCarbTarget = Math.max(0, targetCarb - nonCarbC);
    let carbScale = baseCarbC>0 ? remainingCarbTarget/baseCarbC : 1;
    carbScale = Math.max(0.1, Math.min(carbScale, 10.0));
    carbItems.forEach(it=>{ it.g = Math.max(0, Math.round((it.baseG*carbScale)/5)*5); });

    // Grasas: usa proteína y carbohidratos ya recalculados en esta misma pasada
    const fatItems = allItems.filter(it=> FOODS[it.id].cat === "fat");
    const nonFatF = allItems.filter(it=> FOODS[it.id].cat !== "fat").reduce((s,it)=> s + macrosOf(it.id, it.g).f, 0);
    const baseFatF = fatItems.reduce((s,it)=> s + macrosOf(it.id, it.baseG).f, 0);
    const remainingFatTarget = Math.max(0, targetFat - nonFatF);
    let fatScale = baseFatF>0 ? remainingFatTarget/baseFatF : 1;
    fatScale = Math.max(0.02, Math.min(fatScale, 10.0));
    fatItems.forEach(it=>{ it.g = Math.max(0, Math.round((it.baseG*fatScale)/5)*5); });
  }

  // Límite práctico de porción + reparto del sobrante (evita cantidades absurdas)
  capAndRedistribute(allItems, "carb");
  capAndRedistribute(allItems, "fat");
  capAndRedistribute(allItems, "protein");

  /* AUDITORÍA AUTOMÁTICA + REAJUSTE FINO
     Tras el escalado y los topes de porción, el día puede quedar fuera de
     tolerancia (ej. porque un alimento chocó con su máximo). Aquí se mide
     el resultado REAL y se corrige con pasadas finas hasta entrar en:
       kcal ±3%  ·  proteína ±5%
     Se ajusta primero proteína (el macro más importante para el objetivo),
     luego se cierran las calorías con carbohidratos y grasas. */
  /* Si el dia perdio casi todos sus carbohidratos (paso en perfiles de
     recomposicion con peso alto: quedaba en 71g de 150 objetivo porque
     el arroz se habia eliminado por quedar bajo el minimo), se restaura
     una base de carbohidratos antes de la auditoria fina. */
  (function garantizarCarbos(){
    const totalC = dayTotals(template).c;
    if(targetCarb > 40 && totalC < targetCarb * 0.6){
      const carbItems = allItems.filter(it=> FOODS[it.id].cat === "carb");
      if(carbItems.length){
        const falta = targetCarb - totalC;
        const porItem = falta / carbItems.length;
        carbItems.forEach(it=>{
          const cap = capFor(it.id) || 300 * CAP_FACTOR;
          const gramos = porItem / (FOODS[it.id].c/100 || 1);
          it.g = Math.max(it.g, Math.min(cap, Math.round(gramos)));
          // reinsertar si se habia quitado del plato
          MEAL_KEYS.forEach(meal=>{
            if(!template[meal].includes(it) && it.slotId && it.slotId.startsWith(meal)){
              template[meal].push(it);
            }
          });
        });
      }
    }
  })();

  /* GARANTÍA DE FUENTE PROTEICA — se aplica ANTES de la auditoría fina
     para que ésta pueda compensar el resto de macros.
     En personas muy livianas y muy activas el objetivo de proteína es
     bajo pero las calorías son altas: los carbohidratos (pasta, avena)
     aportaban tanta proteína que el pollo, la carne y el huevo caían
     bajo el mínimo y desaparecían del plato. Cuadraba en números pero
     era un plan sin proteína animal, con aminoácidos incompletos.
     El mínimo se ajusta al tamaño de la persona: para objetivos de
     proteína bajos, exigir 40 g en cada comida se pasaría de la meta. */
  const MIN_PROTEIN_G = Math.max(15, Math.min(40, targetProtein / 5));
  ["desayuno","almuerzo","cena"].forEach(meal=>{
    const enComida = template[meal].filter(it=> FOODS[it.id].cat === "protein");
    if(enComida.length){
      const mayor = enComida.reduce((a,b)=> a.g >= b.g ? a : b);
      if(mayor.g < MIN_PROTEIN_G) mayor.g = Math.round(MIN_PROTEIN_G);
    }
  });

  const TOL_KCAL = 0.025, TOL_PROT = 0.04;
  for(let pass=0; pass<40; pass++){
    const tot = dayTotals(template);
    const pOff = (tot.p - targetProtein) / targetProtein;
    const kOff = (tot.kcal - targetKcal) / targetKcal;
    if(Math.abs(pOff) <= TOL_PROT && Math.abs(kOff) <= TOL_KCAL) break;

    if(Math.abs(pOff) > TOL_PROT){
      const need = targetProtein - tot.p;
      const pItems = allItems.filter(it=> FOODS[it.id].cat === "protein" && it.g > 0);
      const capacity = pItems.reduce((s,it)=>{
        const cap = capFor(it.id) || 400 * CAP_FACTOR;
        return s + (need > 0 ? (cap - it.g) : it.g) * (FOODS[it.id].p/100);
      }, 0);
      if(capacity > 0){
        pItems.forEach(it=>{
          const cap = capFor(it.id) || 400 * CAP_FACTOR;
          const room = need > 0 ? (cap - it.g) : it.g;
          const share = room * (FOODS[it.id].p/100) / capacity;
          const deltaG = (need * share) / (FOODS[it.id].p/100 || 1);
          it.g = Math.max(0, Math.min(cap, Math.round(it.g + deltaG)));
        });
      }
    }

    const tot2 = dayTotals(template);
    const kOff2 = (tot2.kcal - targetKcal) / targetKcal;
    if(Math.abs(kOff2) > TOL_KCAL){
      const needKcal = targetKcal - tot2.kcal;
      const flex = allItems.filter(it=> (FOODS[it.id].cat==="carb" || FOODS[it.id].cat==="fat") && it.g > 0);
      const capacityK = flex.reduce((s,it)=>{
        const cap = capFor(it.id) || 400 * CAP_FACTOR;
        return s + (needKcal > 0 ? (cap - it.g) : it.g) * (FOODS[it.id].kcal/100);
      }, 0);
      if(capacityK > 0){
        flex.forEach(it=>{
          const cap = capFor(it.id) || 400 * CAP_FACTOR;
          const room = needKcal > 0 ? (cap - it.g) : it.g;
          const share = room * (FOODS[it.id].kcal/100) / capacityK;
          const deltaG = (needKcal * share) / (FOODS[it.id].kcal/100 || 1);
          it.g = Math.max(0, Math.min(cap, Math.round(it.g + deltaG)));
        });
      } else break;
    }
  }

  /* Elimina alimentos que quedaron en una cantidad tan pequeña que no
     tiene sentido mostrarlos (regla obligatoria: nunca "Aceite 0 g").
     EXCEPCIÓN: nunca se elimina la última fuente de proteína de una
     comida principal — si la auditoría la dejó muy baja, se sube al
     mínimo visible en vez de borrarla. Sin esto, en personas muy
     livianas el plato quedaba sin ninguna proteína animal. */
  const MIN_DISPLAY_G = 3;
  // Proporcional al objetivo: forzar 25 g fijos en personas pequeñas
  // añadía hasta un 20% de proteína de más sobre su meta.
  const MIN_PROT_VISIBLE = Math.max(10, Math.min(25, targetProtein / 8));
  MEAL_KEYS.forEach(meal=>{
    const esPrincipal = ["desayuno","almuerzo","cena"].includes(meal);
    const protsEnComida = template[meal].filter(it=> FOODS[it.id].cat === "protein");
    let protegido = null;
    if(esPrincipal && protsEnComida.length){
      protegido = protsEnComida.reduce((a,b)=> a.g >= b.g ? a : b);
      if(protegido.g < MIN_PROT_VISIBLE) protegido.g = MIN_PROT_VISIBLE;
    }
    template[meal] = template[meal].filter(it=> it === protegido || it.g >= MIN_DISPLAY_G);
  });

  return template;
}
function dayTotals(template){
  const allItems = allDayItems(template);
  let t2 = {kcal:0,p:0,c:0,f:0};
  allItems.forEach(it=>{ const m = macrosOf(it.id, it.g); t2.kcal+=m.kcal; t2.p+=m.p; t2.c+=m.c; t2.f+=m.f; });
  return t2;
}

  allergyChipsEl.innerHTML = '';
  allergyList.forEach(a=>{
    const c = document.createElement('div');
    c.className='chip'; c.textContent = CURRENT_LANG==='en' ? a.en : a.es; c.dataset.id=a.id;
    c.addEventListener('click', ()=> c.classList.toggle('active'));
    allergyChipsEl.appendChild(c);
  });
  customExcluded.forEach(id=>{
    const c = document.createElement('div');
    c.className='chip active'; c.dataset.id=id; c.dataset.custom="1";
    c.innerHTML = `${foodName(id)} <span class="x">×</span>`;
    c.querySelector('.x').addEventListener('click', (e)=>{
      e.stopPropagation();
      customExcluded = customExcluded.filter(x=>x!==id);
      renderAllergyChips();
    });
    allergyChipsEl.appendChild(c);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip chip-add';
  addChip.textContent = '+ ' + t('addChip');
  addChip.addEventListener('click', ()=>{
    const usedIds = new Set([...allergyList.map(a=>a.id), ...customExcluded]);
    const available = Object.keys(FOODS).filter(id=> !usedIds.has(id));
    if(!available.length) return;
    const sel = document.createElement('select');
    sel.style.cssText = "width:auto;display:inline-block;padding:8px 10px;border-radius:20px;font-size:13px;";
    available.forEach(id=>{
      const opt = document.createElement('option'); opt.value = id; opt.textContent = foodName(id);
      sel.appendChild(opt);
    });

      customExcluded.push(sel.value);
      renderAllergyChips();
    });
    addChip.replaceWith(sel);
    sel.focus();
  });
  allergyChipsEl.appendChild(addChip);
}

/* ============================================================
   4) CÁLCULO PRINCIPAL
   ============================================================
   Fórmulas usadas (fuentes):
   - BMR: Mifflin-St Jeor (1990) — la fórmula más validada para población
     general según la Academy of Nutrition and Dietetics.
   - TDEE: factores de actividad estándar (Katch-McArdle scale).
   - Proteína: rango ISSN Position Stand (Jäger et al. 2017): 1.4–2.0 g/kg
     para mantener/ganar masa muscular; hasta 2.2 g/kg en déficit para
     preservar masa magra (ISSN 2017 sugiere incluso 2.3–3.1 g/kg de masa
     libre de grasa en atletas entrenados — usamos un valor conservador
     sobre peso total, no masa libre de grasa, que no medimos aquí).
   - Grasas: mínimo práctico 0.6–1.0 g/kg (rango usado por guías clínicas
     para función hormonal). - Carbohidratos: resto de las calorías.
   - Piso calórico de seguridad: nunca por debajo de ~1200 kcal (mujeres)
     o ~1500 kcal (hombres) sin importar el déficit solicitado.
   ============================================================ */
document.getElementById('dietForm').addEventListener('submit', function(e){
  e.preventDefault();

  const nombre = document.getElementById('nombre').value.trim() || "—";
  const edad = parseFloat(document.getElementById('edad').value);
  const peso = getWeightKg();    // siempre en kg, sin importar la unidad elegida
  const altura = getHeightCm();  // siempre en cm
  const sexo = document.querySelector('#sexoSeg .seg-btn.active').dataset.val;
  const actFactor = parseFloat(document.querySelector('#actSeg .seg-btn.active').dataset.val);
  const diasEntreno = parseFloat(document.getElementById('diasEntreno').value) || 0;
  const intensidad = (document.querySelector('#intensidadSeg .seg-btn.active') || {dataset:{}}).dataset.val || 'moderada';
  const embarazo = document.getElementById('embarazo').value;
  const minutosSesion = parseFloat(document.getElementById('minutosSesion').value) || 0;
  const tipoEntreno = document.querySelector('#tipoSeg .seg-btn.active').dataset.val;
  const goal = document.querySelector('#goalSeg .seg-btn.active').dataset.val;
  const condicion = document.getElementById('condicion').value;
  const country = document.getElementById('pais').value;
  const excludedAllergy = Array.from(document.querySelectorAll('#allergyChips .chip.active')).map(c=>c.dataset.id);
  const condRule = CONDITION_RULES[condicion] || CONDITION_RULES.ninguna;
  const excluded = Array.from(new Set([...excludedAllergy, ...customExcluded, ...condRule.exclude]));

  if(!peso || !altura || !edad){ return; }
  if(!country){ // sin país no hay moneda ni precios que aplicar
    const paisSel = document.getElementById('pais');
    clearFieldError(paisSel); showFieldError(paisSel, t('errPais'));
    paisSel.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  // --- BMR (Mifflin-St Jeor) ---
  let bmr;
  if(sexo === "hombre") bmr = 10*peso + 6.25*altura - 5*edad + 5;
  else if(sexo === "mujer") bmr = 10*peso + 6.25*altura - 5*edad - 161;
  else bmr = 10*peso + 6.25*altura - 5*edad - 78;

  /* AJUSTE POR VOLUMEN DE ENTRENAMIENTO
     Alguien que dice ser "sedentario" pero entrena 8 horas a la semana
     no lo es: su gasto real es mucho mayor. Sin este ajuste, la app le
     daba calorías de sedentario con proteína de atleta, y no quedaba
     espacio para carbohidratos (el objetivo se volvía imposible de
     cumplir con comida real).
     El incremento es conservador: el ejercicio ya está parcialmente
     contemplado en el factor de actividad, así que solo se suma la
     diferencia que el volumen declarado no puede estar cubriendo. */
  /* La intensidad pondera el volumen (principio FITT de la ACSM):
     60 min de caminata suave no equivalen a 60 min de alta intensidad.
     Sin este factor, ambos daban el mismo gasto energetico. */
  const FACTOR_INTENSIDAD = { suave: 0.65, moderada: 1.0, alta: 1.35 };
  const volumenSemanal = diasEntreno * minutosSesion * (FACTOR_INTENSIDAD[intensidad] || 1);
  /* TECHO AL AJUSTE AUTOMATICO
     El factor 1.9 esta reservado a quien SUMA trabajo fisico pesado y
     entrenamiento; el ejercicio por si solo no llega ahi. Sin este
     techo, alguien que se declara sedentario pero entrena 6 dias
     saltaba a 1.9 y su objetivo se inflaba varios cientos de kcal.
     Como la evidencia muestra que ~80% de las personas ya sobreestiman
     su actividad, el ajuste automatico solo puede subir hasta 1.725:
     el 1.9 queda reservado a quien lo elige a conciencia. */
  let actEfectivo = actFactor;
  if(volumenSemanal >= 420)      actEfectivo = Math.max(actFactor, 1.725);
  else if(volumenSemanal >= 240) actEfectivo = Math.max(actFactor, 1.55);
  else if(volumenSemanal >= 90)  actEfectivo = Math.max(actFactor, 1.375);
  else if(volumenSemanal === 0)  actEfectivo = Math.min(actFactor, 1.55); // no entrena

  const tdee = bmr * actEfectivo;

  let calorieTarget;
  /* ============================================================
     EMBARAZO Y LACTANCIA — ajuste obligatorio de seguridad
     Un déficit calórico en el embarazo compromete el desarrollo fetal,
     y en lactancia reduce la producción de leche. La app permitía
     elegir "perder grasa" en ambos casos sin ninguna advertencia.
     Ahora el déficit se anula y se añade el aporte extra que indican
     las guías: +340 kcal en el 2º trimestre (se usa como referencia
     general) y +450-500 kcal en lactancia.
     Esto NO sustituye el seguimiento obstétrico: la app lo advierte. */
  const esGestante = (embarazo === "embarazo" || embarazo === "lactancia");
  if(esGestante){
    calorieTarget = tdee + (embarazo === "lactancia" ? 450 : 340);
  }
  else if(goal === "bulk") calorieTarget = tdee * 1.08;
  else if(goal === "cut") calorieTarget = tdee * 0.82;
  else calorieTarget = tdee * 0.98;

  // Piso de seguridad — nunca recomendar menos de esto, sin importar el déficit.
  const calorieFloor = sexo === "mujer" ? 1200 : 1500;
  let floorApplied = false;
  if(calorieTarget < calorieFloor){ calorieTarget = calorieFloor; floorApplied = true; }

  /* PROTEÍNA — respaldo científico (ISSN Position Stand: Protein and Exercise)
     · Base para construir/mantener músculo: 1.4–2.0 g/kg/día
     · Rango asociado a MAYOR ganancia de masa magra en entrenados: 1.6–2.2 g/kg/día
     · El efecto se estabiliza pasando ~2.0–2.2 g/kg/día (más no aporta más músculo)
     · En déficit calórico hace falta MÁS proteína para no perder músculo: 2.3–3.1 g/kg
     Por eso: ganar masa 2.0 · recomposición 2.1 · perder grasa 2.3 (el déficit es
     cuando el músculo corre más riesgo). Antes ganar masa recibía solo 1.8, por
     debajo del rango óptimo — corregido. */
  /* La proteína depende del OBJETIVO y del NIVEL DE ACTIVIDAD.
     Los rangos altos del ISSN (2.3–3.1 g/kg en déficit) están estudiados
     en personas que ENTRENAN. Aplicárselos a alguien sedentario daba
     cifras irreales: una mujer de 85 kg sedentaria en déficit recibía
     195 g de proteína en 1576 kcal — el 49% de sus calorías, imposible
     de cubrir con comida real y sin respaldo para su caso.
     Para sedentarios se usa el rango de preservación muscular
     (1.4–1.8 g/kg), que sigue por encima de la RDA de 0.8. */
  /* El nivel para la proteína sale del factor EFECTIVO, que ya incorpora
     el volumen de entrenamiento. Así proteína y calorías van siempre
     coherentes entre sí. */
  const activityKey = actEfectivo >= 1.725 ? "alto" : (actEfectivo >= 1.5 ? "medio" : "sedentario");

  /* PROTEÍNA — ISSN Position Stand (protein and exercise)
     · 1.4–2.0 g/kg/día construye y mantiene masa muscular en la mayoría
     · 2.3–3.1 g/kg/día maximiza la retención de masa magra en DÉFICIT
     · Hay evidencia de beneficio hasta ~2.2 g/kg en superávit
     Se usa el extremo alto del rango para quien entrena, porque el
     objetivo de la app es ganar músculo, no solo cubrir el mínimo. */
  const PROTEIN_TABLE = {
    /* Sin entrenamiento declarado: el rango alto del ISSN (1.9–2.6 g/kg)
       está estudiado para preservar músculo EN QUIEN ENTRENA. Sin estímulo
       de fuerza no aporta beneficio adicional, y en déficit dejaba el
       objetivo sin espacio para el resto de macros. Se usa el rango de
       preservación (1.2–1.5), que sigue muy por encima de la RDA de 0.8. */
    ninguno:    { cut: 1.5, recomp: 1.4, bulk: 1.3 },
    sedentario: { cut: 1.9, recomp: 1.7, bulk: 1.6 },
    medio:      { cut: 2.4, recomp: 2.2, bulk: 2.1 },
    alto:       { cut: 2.6, recomp: 2.4, bulk: 2.2 },
  };
  const nivelProteina = (diasEntreno === 0 || minutosSesion === 0) ? "ninguno" : activityKey;
  let proteinPerKg = PROTEIN_TABLE[nivelProteina][goal] || PROTEIN_TABLE[nivelProteina].bulk;

  /* RESISTENCIA ANABOLICA DEL ENVEJECIMIENTO
     A partir de los ~60 años el músculo responde peor al mismo estímulo
     de aminoácidos: hace falta una dosis mayor por comida para activar
     la síntesis proteica (el umbral de leucina sube de ~2.5 g a ~3 g).
     La app daba a una persona de 70 años exactamente la misma proteína
     que a una de 25, lo que la deja por debajo de sus necesidades reales.
     Se aplica un incremento gradual respaldado por la literatura de
     sarcopenia, sin superar el techo de seguridad ya existente. */
  if(edad >= 75)      proteinPerKg *= 1.25;
  else if(edad >= 65) proteinPerKg *= 1.20;
  else if(edad >= 55) proteinPerKg *= 1.10;
  /* El incremento por edad nunca puede empujar la proteína por encima
     del techo superior del rango estudiado (3.1 g/kg): sin este límite,
     2.6 × 1.25 daba 3.25 g/kg, fuera de lo respaldado por evidencia. */
  proteinPerKg = Math.min(proteinPerKg, 3.0);
  /* Tope absoluto de proteína: por encima de ~220 g/día no hay beneficio
     adicional demostrado (el efecto se estabiliza pasando ~2.0–2.2 g/kg),
     y en personas de peso muy alto un porcentaje fijo daría cifras poco
     realistas de comer (300 g) que además dejarían sin espacio a los
     carbohidratos. */
  /* PESO DE REFERENCIA PARA MACROS (práctica clínica estándar)
     En personas con IMC alto, calcular proteína y grasa sobre el peso
     TOTAL da cifras desproporcionadas: a una mujer de 120 kg le pedía
     216 g de proteína en 1920 kcal — el 45% de sus calorías, imposible
     de cubrir con comida real. El tejido graso no requiere proteína para
     mantenerse, así que se usa un peso ajustado (el que daría IMC 27.5)
     cuando el IMC supera 30. Las CALORÍAS siguen calculándose con el
     peso real, porque el gasto energético sí depende del peso total. */
  const alturaM = altura / 100;
  const imcActual = peso / (alturaM * alturaM);
  /* Umbral en IMC 27 (no 30): con 30 se quedaban fuera casos de sobrepeso
     claro — una persona con IMC 28.9 recibía proteína calculada sobre su
     peso total, y el objetivo se volvía imposible de cubrir con comida
     real (43% de las calorías solo en proteína). */
  const pesoMacros = imcActual > 27 ? (25 * alturaM * alturaM) : peso;

  /* TOPE POR PORCENTAJE DE CALORÍAS
     El límite de 220 g es absoluto, pero faltaba uno relativo: cuando
     las calorías objetivo son muy bajas (personas mayores, de bajo peso
     o en déficit profundo) la proteína llegaba a ocupar el 47% de las
     calorías del día. Con eso no queda margen para grasa y carbohidratos,
     y el menú no puede cumplirlo con comida real.
     El techo del 35% deja siempre espacio al resto del reparto y sigue
     por encima de lo que cualquier guía recomienda como proporción. */
  let proteinTarget = Math.min(pesoMacros * proteinPerKg, 220, (calorieTarget * 0.35) / 4);
  /* GRASA — 1.2 g/kg
     Con 1.0 los carbohidratos seguían ocupando ~54% de las calorías en
     superávit. Subir la grasa a 1.2 g/kg (nivel saludable, muy por
     encima del mínimo hormonal de 0.6) baja los carbohidratos a un
     reparto más equilibrado sin tocar la proteína. El entrenamiento de
     fuerza no necesita las cargas de 8–12 g/kg de carbohidratos que el
     ISSN reserva para deportes de resistencia de alto volumen. */
  /* La grasa se calcula por peso, pero con calorías bajas ese valor
     acababa ocupando más del 45% del día. Se limita al 40% para que el
     reparto siga siendo práctico de comer. */
  let fatTarget = Math.min(pesoMacros * 1.2, (calorieTarget * 0.40) / 9);
  let carbTarget = Math.max(0, (calorieTarget - (proteinTarget*4 + fatTarget*9)) / 4);

  /* AJUSTE DE SEGURIDAD — personas de peso alto en déficit
     En algunos casos (ej. 110 kg, sedentaria, perder grasa) la proteína
     alta + la grasa ya superan las calorías objetivo, y los carbohidratos
     caían a 0 g: una dieta cetogénica involuntaria que la app nunca
     prometió. Aquí se reserva un mínimo razonable de carbohidratos
     (~20% de las calorías) y se recorta primero la grasa y, si aún no
     alcanza, la proteína — pero NUNCA por debajo de 1.6 g/kg, el piso
     con respaldo científico para conservar masa muscular. */
  /* Se apunta al 25% de carbohidratos (no al 20%): con 20% la grasa
     acababa ocupando hasta el 50% de las calorías en perfiles sedentarios
     en déficit, un reparto poco práctico de comer. */
  const minCarb = (calorieTarget * 0.25) / 4;
  if(carbTarget < minCarb){
    const faltanKcal = (minCarb - carbTarget) * 4;
    const grasaMin = pesoMacros * 0.6;                 // mínimo para función hormonal
    const recorteGrasaKcal = Math.min(faltanKcal, Math.max(0, (fatTarget - grasaMin) * 9));
    fatTarget -= recorteGrasaKcal / 9;
    const restanKcal = faltanKcal - recorteGrasaKcal;
    if(restanKcal > 0){
      /* El piso de proteína se ajusta al nivel de entrenamiento: exigir
         1.6 g/kg a quien no entrena era MÁS que su propio objetivo (1.5),
         así que el ajuste no podía recortar nada y quedaba bloqueado. */
      const proteinaMin = pesoMacros * (nivelProteina === "ninguno" ? 1.2 : 1.6);
      const recorteProtKcal = Math.min(restanKcal, Math.max(0, (proteinTarget - proteinaMin) * 4));
      proteinTarget -= recorteProtKcal / 4;
    }
    carbTarget = Math.max(0, (calorieTarget - (proteinTarget*4 + fatTarget*9)) / 4);
  }
  const bmi = peso / Math.pow(altura/100, 2);
  /* Aviso de objetivo calórico extremo: por encima de ~5000 kcal el plan
     de 4 comidas no es práctico (hay que repartir en 6 o más tomas), y la
     app no puede generarlo con precisión. Se informa en vez de callarlo. */
  const objetivoMuyAlto = calorieTarget > 5000;

  function pickAlt(id){
    if(!excluded.includes(id)) return id;
    const cat = FOODS[id].cat;
    const alts = Object.keys(FOODS).filter(k=> FOODS[k].cat===cat && !excluded.includes(k));
    return alts.length ? alts[0] : id;
  }

  const days = [];
  const monthlyConsumptionG = {};
  for(let d=0; d<30; d++){
    let tmpl = buildDayTemplate(d);
    MEAL_KEYS.forEach(meal=>{ tmpl[meal].forEach(it=>{ it.id = pickAlt(it.id); }); });
    if(condRule.capSeasonings){ tmpl.condimentos.forEach(it=>{ if(it.id === "sal") it.baseG = Math.min(it.baseG, 1); }); }
    tmpl = scaleDayToTarget(tmpl, calorieTarget, proteinTarget, carbTarget, fatTarget);
    const totals = dayTotals(tmpl);
    days.push({ idx:d+1, tmpl, totals });
    allDayItems(tmpl).forEach(it=>{ monthlyConsumptionG[it.id] = (monthlyConsumptionG[it.id]||0) + it.g; });
  }

  let priceSet = PRICES[country];
  let usedFallbackCountry = false;
  if(!priceSet){ priceSet = PRICES.GEN; usedFallbackCountry = true; }
  const purchase = Object.keys(monthlyConsumptionG).map(id=>{
    const f = FOODS[id];
    const gramsNeeded = monthlyConsumptionG[id];
    const unitsNeeded = purchaseUnits(gramsNeeded, id);
    const price = priceSet[id] || 0;
    const subtotal = unitsNeeded * price;
    return { id, name:foodName(id), gramsNeeded, unitsNeeded, unit:f.unit, price, subtotal, group: shopGroup(id) };
  }).sort((a,b)=> (SHOP_GROUP_META[a.group].order - SHOP_GROUP_META[b.group].order) || (b.subtotal - a.subtotal));
  const totalCost = purchase.reduce((s,p)=> s+p.subtotal, 0);

  const avg = days.reduce((s,d)=>({kcal:s.kcal+d.totals.kcal, p:s.p+d.totals.p, c:s.c+d.totals.c, f:s.f+d.totals.f}), {kcal:0,p:0,c:0,f:0});
  Object.keys(avg).forEach(k=> avg[k] = avg[k]/30);

  renderResults({nombre, edad, sexo, peso, altura, bmi, bmr, tdee, calorieTarget, proteinTarget, carbTarget, fatTarget,
                  floorApplied, objetivoMuyAlto, esGestante, embarazo, country, priceSet, usedFallbackCountry, days, purchase, totalCost, avg, goal, condicion,
                  diasEntreno, minutosSesion, tipoEntreno,
                  // Para la analitica: nivel real de actividad y costo comparable
                  actEfectivo, pesoKg: peso,
                  costoUsd: costoEnDolares(totalCost, country)});
});

/* ============================================================
   5) RENDER DE RESULTADOS
   ============================================================ */
function fmt(n, d=0){ return n.toLocaleString('es', {maximumFractionDigits:d, minimumFractionDigits:d}); }

/* FORMATO DE DINERO
   fmt() redondea a enteros, lo que en monedas con decimales (EUR, USD)
   hacía que un huevo de 0,28 € se mostrara como "0 €" y pareciera que
   el precio faltaba. Ahora los importes pequeños conservan decimales:
   · menos de 10  -> 2 decimales  (0,28 €)
   · 10 a 99      -> 1 decimal    (27,4 €)
   · 100 o más    -> entero       (1.304 €)
   En monedas sin decimales de uso corriente (peso chileno, guaraní,
   colón...) los valores nunca caen en ese rango, así que se ven igual. */
function fmtMoney(n){
  if(!isFinite(n)) return "0";
  const abs = Math.abs(n);
  if(abs === 0) return "0";
  if(abs < 10) return n.toLocaleString('es', {minimumFractionDigits:2, maximumFractionDigits:2});
  if(abs < 100) return n.toLocaleString('es', {minimumFractionDigits:1, maximumFractionDigits:1});
  return n.toLocaleString('es', {maximumFractionDigits:0});
}

/* Alimentos que se compran/consumen por unidad (huevo, aguacate, frutas...)
   se muestran como "X unidades" en vez de gramos — más natural para
   comprar y para llevar la cuenta de cuántos necesitas. El resto (carnes,
   arroz, aceite, etc.) se sigue mostrando en gramos/libras. */
function consumptionDisplay(gramsAmount, foodId){
  const f = FOODS[foodId];
  if(f.unit === "unidad" || f.unit === "unidad_grande"){
    const units = gramsAmount / f.gPerUnit;
    const label = CURRENT_LANG === 'en' ? (units===1?'unit':'units') : (units===1?'unidad':'unidades');
    return `${fmt(units, units<3?1:0)} ${label}`;
  }
  return `${fmt(gramsAmount)} g`;
}

/* Presentaciones comerciales legibles — en vez de mostrar el código interno
   ("paquete400g", "unidad_grande"), se muestra en texto natural con
   singular/plural correcto: "2 paquetes de 400 g", "3 unidades grandes". */
function unitLabel(unit, count, lang){
  const es = lang !== 'en';
  const plural = count !== 1;
  const map = {
    lb:            es ? (plural?'libras':'libra') : (plural?'lbs':'lb'),
    unidad:        es ? (plural?'unidades':'unidad') : (plural?'units':'unit'),
    lata:          es ? (plural?'latas':'lata') : (plural?'cans':'can'),
    unidad_grande: es ? (plural?'unidades grandes':'unidad grande') : (plural?'large units':'large unit'),
    paquete400g:   es ? `paquete${plural?'s':''} de 400 g` : `${plural?'packs':'pack'} of 400 g`,
    paquete100g:   es ? `paquete${plural?'s':''} de 100 g` : `${plural?'packs':'pack'} of 100 g`,
    paquete1kg:    es ? `paquete${plural?'s':''} de 1 kg`  : `${plural?'packs':'pack'} of 1 kg`,
    frasco50g:     es ? `frasco${plural?'s':''} de 50 g`   : `${plural?'jars':'jar'} of 50 g`,
    botella750:    es ? `botella${plural?'s':''} de 750 ml`: `${plural?'bottles':'bottle'} of 750 ml`,
  };
  return map[unit] || unit;
}

/* ============================================================
   #3 CAMBIAR ALIMENTO — sustituir un alimento por otro de la misma
   categoría y recalcular automáticamente ese día (y con eso, el mes
   completo: compra, costo, promedio) sin alterar el objetivo nutricional
   original — se vuelve a escalar ese día hacia el MISMO objetivo de
   siempre, solo que con el alimento nuevo en ese puesto.
   ============================================================ */
let CURRENT_RESULT = null;
let openWeeks = new Set([0]); // qué semanas están desplegadas (persiste entre recálculos)

function recomputeAll(R){
  const consumption = {};
  R.days.forEach(d=>{
    allDayItems(d.tmpl).forEach(it=>{ consumption[it.id] = (consumption[it.id]||0) + it.g; });
  });
  R.purchase = Object.keys(consumption).map(id=>{
    const f = FOODS[id];
    const gramsNeeded = consumption[id];
    const unitsNeeded = purchaseUnits(gramsNeeded, id);
    const price = R.priceSet[id] || 0;
    const subtotal = unitsNeeded * price;
    return { id, name:foodName(id), gramsNeeded, unitsNeeded, unit:f.unit, price, subtotal, group: shopGroup(id) };
  }).sort((a,b)=> (SHOP_GROUP_META[a.group].order - SHOP_GROUP_META[b.group].order) || (b.subtotal - a.subtotal));
  R.totalCost = R.purchase.reduce((s,p)=> s+p.subtotal, 0);
  const avg = R.days.reduce((s,d)=>({kcal:s.kcal+d.totals.kcal, p:s.p+d.totals.p, c:s.c+d.totals.c, f:s.f+d.totals.f}), {kcal:0,p:0,c:0,f:0});
  Object.keys(avg).forEach(k=> avg[k] = avg[k]/30);
  R.avg = avg;
}

function swapFoodItem(R, dayIdx, mealKey, slotId, newFoodId){
  const day = R.days[dayIdx-1];
  const item = day.tmpl[mealKey].find(it=> it.slotId === slotId);
  if(!item) return;
  item.id = newFoodId; // conserva el mismo baseG del puesto — solo cambia QUÉ alimento lo ocupa
  scaleDayToTarget(day.tmpl, R.calorieTarget, R.proteinTarget, R.carbTarget, R.fatTarget);
  day.totals = dayTotals(day.tmpl);
  recomputeAll(R);
  renderResults(R, {scroll:false});
}

function openSwapPicker(btn){
  if(!CURRENT_RESULT) return;
  const dayIdx = parseInt(btn.dataset.day, 10);
  const mealKey = btn.dataset.meal;
  const slotId = btn.dataset.slot;
  const day = CURRENT_RESULT.days[dayIdx-1];
  const item = day.tmpl[mealKey].find(it=> it.slotId === slotId);
  if(!item) return;
  const cat = FOODS[item.id].cat;
  const alternatives = Object.keys(FOODS).filter(id=> FOODS[id].cat===cat && id!==item.id);
  if(!alternatives.length) return;
  const sel = document.createElement('select');
  sel.className = 'swap-select';
  sel.innerHTML = `<option value="">${t('r_cambiarTitulo')}</option>` +
    alternatives.map(id=> `<option value="${id}">${foodName(id)}</option>`).join('');
  sel.addEventListener('change', ()=>{
    if(sel.value) swapFoodItem(CURRENT_RESULT, dayIdx, mealKey, slotId, sel.value);
  });
  btn.closest('.food-chip').replaceWith(sel);
}
document.addEventListener('click', function(e){
  const btn = e.target.closest('.swap-btn');
  if(btn) openSwapPicker(btn);
});

function rangoEdad(n){

  if(n < 45) return '35-44';
